      { lec:8, type:"mcq", text:"Choose which of the following drugs is used in influenza infections to block the attachment of the virus to host cells?", options:[{text:"remdesivir (Veklury)",correct:false},{text:"azidothymidine (AZT)",correct:false},{text:"acyclovir (Zovirax)",correct:false},{text:"amantadine (Symmetrel)",correct:true}], explanation:"Amantadine works as a decoy receptor, blocking viral attachment in influenza." },
      { lec:8, type:"sata", text:"Which of the following apply to the antiviral medication Truvada? (SATA)", options:[{text:"It includes base analogues that stop the action of reverse transcriptase",correct:true},{text:"It is an anti-HIV medication",correct:true},{text:"It acts similarly to AZT",correct:false},{text:"It is a combination drug containing two NRTIs or 'nukes'",correct:true}], explanation:"Truvada (PrEP) is a daily prevention medicine for HIV, consisting of two NRTIs (nukes) that act as base analogues. (Note: The provided image shows A, B, and D as the correct selections)." },
      { lec:8, type:"mcq", text:"Protease _____ long viral protein chains into pieces, while reverse transcriptase _____.", options:[{text:"cuts ; converts viral RNA into DNA.",correct:true},{text:"builds ; converts DNA into RNA.",correct:false},{text:"converts viral RNA into DNA ; cuts",correct:false},{text:"blocks ; duplicates viral proteins",correct:false}], explanation:"Protease cuts viral protein chains; reverse transcriptase converts RNA to DNA." },
      { lec:8, type:"mcq", text:"Paxlovid is a combination drug that is used to treat SARS CoV 2 infections. How does it work?", options:[{text:"It blocks the attachment of the virus to host cells",correct:false},{text:"It inhibits the SARS CoV 2 enzyme protease",correct:true},{text:"It acts as a base analogue, inhibiting RNA synthesis",correct:false},{text:"It is an interferon which generates blocking proteins",correct:false}], explanation:"Paxlovid contains nirmatrelvir, which inhibits the SARS-CoV-2 protease, and ritonavir, which slows its breakdown." },
      { lec:8, type:"mcq", text:"Oseltamivir (Tamiflu) is a neuraminidase inhibitor. What does it stop?", options:[{text:"Cutting of viral protein chains",correct:false},{text:"Conversion of viral RNA into DNA",correct:false},{text:"Attachment of the virus to receptors",correct:false},{text:"Enzymes that let the virus penetrate and exit the cell",correct:true}], explanation:"Neuraminidase inhibitors block the spike enzymes that allow influenza to penetrate and exit cells." },
      { lec:8, type:"mcq", text:"Which of these is classed as a nuke?", options:[{text:"Nevirapine",correct:false},{text:"Saquinavir",correct:false},{text:"Azidothymidine (AZT)",correct:true},{text:"Oseltamivir",correct:false}], explanation:"AZT is a nucleoside reverse transcriptase inhibitor (NRTI), commonly called a 'nuke'." },
      { lec:8, type:"mcq", text:"When are monoclonal antibody treatments most useful?", options:[{text:"Only after a full course of vaccination",correct:false},{text:"When given early, within 10 days of infection, to the highest-risk groups",correct:true},{text:"As a replacement for vaccination",correct:false},{text:"Only for bacterial infections",correct:false}], explanation:"Monoclonal antibodies (-mabs) work best early, within 10 days, for highest-risk groups, and are not a replacement for vaccination." },
      { lec:8, type:"mcq", text:"Remdesivir (Veklury) is a base analog. What does it do?", options:[{text:"Blocks viral attachment by mimicking receptors",correct:false},{text:"Cuts viral protein chains",correct:false},{text:"Converts viral RNA into DNA",correct:false},{text:"Stops the chain from growing, preventing copies of viral RNA genomes",correct:true}], explanation:"Remdesivir is an RNA chain terminator (fake base) that stops viral RNA copying." },
      { lec:8, type:"sata", text:"Which statements about interferons are correct? (SATA)", options:[{text:"They are synthetic drugs made only in labs.",correct:false},{text:"They are natural proteins; about 20 types are grouped as alpha, beta and gamma.",correct:true},{text:"Gamma interferons come from virally infected cells and stimulate antiviral protein production.",correct:false},{text:"Alpha and beta interferons come from virally infected cells and stimulate antiviral protein production.",correct:true}], explanation:"Interferons are natural. Alpha/beta come from infected cells and stimulate AVPs; gamma comes from tumour cells." },
      { lec:8, type:"mcq", text:"Within Paxlovid, what does ritonavir do?", options:[{text:"Slows metabolism of the protease inhibitor so it lasts longer",correct:true},{text:"Inhibits the SARS-CoV-2 protease directly",correct:false},{text:"Acts as a monoclonal antibody",correct:false},{text:"Blocks interferon production",correct:false}], explanation:"Ritonavir slows the breakdown (metabolism) of nirmatrelvir so the drug stays active in the body longer." },
      { lec:8, type:"mcq", text:"How do antiviral proteins (AVPs) stop viral protein synthesis?", options:[{text:"By cutting viral DNA into pieces",correct:false},{text:"By blocking neuraminidase",correct:false},{text:"By binding viral mRNA",correct:true},{text:"By stimulating natural killer cells",correct:false}], explanation:"AVPs bind to viral mRNA, blocking the protein synthesis the virus needs." },
      { lec:8, type:"mcq", text:"Which is the correct order of drug testing?", options:[{text:"Laboratory (in vitro), then animal (in vivo), then clinical trials",correct:true},{text:"Animal (in vivo), then clinical trials, then laboratory",correct:false},{text:"Clinical trials, then laboratory, then animal",correct:false},{text:"Laboratory, then clinical trials, then animal",correct:false}], explanation:"Testing progresses from the lab (in vitro) to animals (in vivo) to humans (clinical trials)." },
      { lec:8, type:"mcq", text:"Which phase tests a new drug in about 20 to 100 healthy people, looking at doses, side effects and bioavailability?", options:[{text:"Phase I",correct:true},{text:"Phase II",correct:false},{text:"Phase III",correct:false},{text:"Post-approval monitoring",correct:false}], explanation:"Phase I is the first human test, using 20-100 healthy subjects." },
      { lec:8, type:"sata", text:"Which statements about Phase II and Phase III trials are correct? (SATA)", options:[{text:"Phase II uses about 500 patients with the disease.",correct:true},{text:"Phase III uses 20 to 100 healthy volunteers.",correct:false},{text:"Phase III compares the drug to an established method and produces efficacy and safety statistics.",correct:true},{text:"Phase II is always the first test in humans.",correct:false}], explanation:"Phase II uses ~500 patients; Phase III compares to an established method in thousands of patients. Phase I is the first human test." },
      { lec:8, type:"mcq", text:"Why are Phase III trials triple blinded?", options:[{text:"So the patient, the provider giving the drug and the institution do not know which drug is which",correct:true},{text:"To reduce the number of subjects needed",correct:false},{text:"To speed approval by one year",correct:false},{text:"To stop side effects from being monitored",correct:false}], explanation:"Blinding stops everyone knowing which drug is which, so the results are objective and fair." },
      { lec:8, type:"mcq", text:"About how many drugs make it through clinical trials (from their development to the end of clinical trials)?", options:[{text:"1/5000",correct:true},{text:"1/50",correct:false},{text:"1/10",correct:false},{text:"1/1000",correct:false}], explanation:"About 1 in 1000 reach humans, but only 1 in 5000 make it completely through trials." },
      { lec:8, type:"mcq", text:"A bacterium pumps a drug out of the cell before the drug can act. Which mechanism is this?", options:[{text:"Destruction of the drug",correct:false},{text:"Prevention of drug penetration",correct:false},{text:"Rapid efflux",correct:true},{text:"Alteration of the target site",correct:false}], explanation:"Rapid efflux involves pumps that actively push the drug back out of the cell." },
      { lec:8, type:"sata", text:"Which factors contribute to antibiotic resistance, according to the notes? (SATA)", options:[{text:"Overprescription",correct:true},{text:"Self-medication",correct:true},{text:"Taking the full course every time",correct:false},{text:"Incomplete antibiotic regimens",correct:true}], explanation:"Overprescription, self-medication, and incomplete regimens give resistant bacteria a chance to survive and multiply." },

    // ==========================================

    function init() {

                carouselMode = true; // Flashcards force carousel

            savedFlagged.forEach(id => flaggedQids.add(id));
        } catch(e) {}

        buildShuffledQuestionSet();

        const countAll = questionBank.length;
        const count5 = questionBank.filter(q => q.lec === 5).length;
        const count6 = questionBank.filter(q => q.lec === 6).length;
        const count7 = questionBank.filter(q => q.lec === 7).length;
        const count8 = questionBank.filter(q => q.lec === 8).length;

    function saveState() {
        try {
            const stateArr = Array.from(userState.entries()).map(([qid, state]) => ({qid, state}));
            localStorage.setItem(LS_STATE, JSON.stringify(stateArr));
            localStorage.setItem(LS_INCORRECT, JSON.stringify(Array.from(incorrectQids)));
            localStorage.setItem(LS_FLAGGED, JSON.stringify(Array.from(flaggedQids)));
            localStorage.setItem(LS_SETTINGS, JSON.stringify({
                isDark: document.body.classList.contains('dark-mode'),
                carouselMode,
                examMode,
                examGraded,
                flashcardMode
            }));
        } catch(e) {}
    }

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildShuffledQuestionSet() {
        const grouped = [];
        const lectureNumbers = [...new Set(questionBank.map(q => q.lec))].sort((a, b) => String(a).localeCompare(String(b)));
        for (const lec of lectureNumbers) {
            const lectureQuestions = questionBank
                .map((q, index) => ({ ...q, qid: index }))
                .filter(q => String(q.lec) === String(lec));
            grouped.push(...shuffleArray(lectureQuestions).map(q => ({
                ...q,
                options: shuffleArray(q.options)
            })));
        }
        shuffledQuestions = shuffleArray(grouped);
    }

    function generateQuick20() {
        let q20 = [];
        try {
            q20 = JSON.parse(localStorage.getItem(LS_QUICK20) || '[]');
        } catch(e){}

        if(q20.length !== 20) {
            // Need exactly 4 from each category: 5, 6, 7, 8, bar
            const cats = ['5', '6', '7', '8', 'bar'];
            q20 = [];
            cats.forEach(c => {
                const qs = shuffledQuestions.filter(q => String(q.lec) === c);
                q20.push(...qs.slice(0, 4).map(q => q.qid));
            });
            localStorage.setItem(LS_QUICK20, JSON.stringify(q20));
        }
        return q20;
    }

    function setActiveQuestions(lec) {
        currentLec = lec;
        let baseList = [];
        
        if (lec === "all") {
            baseList = [...shuffledQuestions];
        } else if (lec === "incorrect") {
            baseList = shuffledQuestions.filter(q => incorrectQids.has(q.qid));
        } else if (lec === "flagged") {
            baseList = shuffledQuestions.filter(q => flaggedQids.has(q.qid));
        } else if (lec === "quick20") {
            const q20Ids = new Set(generateQuick20());
            baseList = shuffledQuestions.filter(q => q20Ids.has(q.qid));
        } else if (lec === "custom") {
            const cqIds = new Set(customQuizQids);
            baseList = shuffledQuestions.filter(q => cqIds.has(q.qid));
        } else {
            baseList = shuffledQuestions.filter(q => String(q.lec) === String(lec));
        }
        
        if (searchString.trim() !== "") {
            const lowerSearch = searchString.toLowerCase();
            baseList = baseList.filter(q => 
                q.text.toLowerCase().includes(lowerSearch) || 
                q.options.some(o => o.text.toLowerCase().includes(lowerSearch)) ||
                q.explanation.toLowerCase().includes(lowerSearch)
            );
        }
        
        activeQuestions = baseList;
        carouselIndex = 0;
    }

    function handleSearch() {
        searchString = document.getElementById('searchInput').value;
        setActiveQuestions(currentLec);
        renderQuestions();
        updateScore();
    }

    function resetAttempt() {
        if(!confirm("Are you sure you want to reset all your progress?")) return;
        userState.clear();
        incorrectQids.clear();
        flaggedQids.clear();
        localStorage.removeItem(LS_QUICK20);
        examGraded = false;
        saveState();
        
        buildShuffledQuestionSet();
        setActiveQuestions(currentLec);
        updateIncorrectTabCount();
        updateFlaggedTabCount();
        renderQuestions();
        updateScore();
    }

    function filterQuestions(lec, button) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        setActiveQuestions(lec);
        renderQuestions();
        updateScore();
    }

    function updateScore() {
        const gradeBar = document.getElementById('examGradeBar');
        if(examMode && !examGraded) {
            document.getElementById('score-counter').textContent = `Grade: --%`;
            gradeBar.style.display = 'block';
            return;
        }
        gradeBar.style.display = 'none';

        let submittedCount = 0;
        let totalScore = 0;

        userState.forEach(state => {
            if (state.submitted) {
                submittedCount++;
                totalScore += state.score;
            }
        });

        const grade = submittedCount > 0
            ? Math.round((totalScore / submittedCount) * 100)
            : 0;

        const scoreElem = document.getElementById('score-counter');
        scoreElem.textContent = `Grade: ${grade}%`;
        scoreElem.title = `Answered ${submittedCount} / ${activeQuestions.length}`;
    }

    function updateIncorrectTabCount() {
        const btn = document.getElementById('tab-incorrect');
        if (btn) btn.textContent = `Review Incorrect (${incorrectQids.size})`;
    }
    
    function updateFlaggedTabCount() {
        const btn = document.getElementById('tab-flagged');
        if (btn) btn.textContent = `📌 Flagged (${flaggedQids.size})`;
    }

    function toggleFlag(qid, event) {
        if(event) event.stopPropagation();
        if(flaggedQids.has(qid)) {
            flaggedQids.delete(qid);
        } else {
            flaggedQids.add(qid);
        }
        updateFlaggedTabCount();
        saveState();
        
        const btn = document.getElementById(`flag-${qid}`);
        if(btn) {
            btn.classList.toggle('flagged', flaggedQids.has(qid));
        }
        
        // If we unflag while on the flagged tab, re-render
        if(currentLec === 'flagged' && !flaggedQids.has(qid)) {
            setActiveQuestions('flagged');
            renderQuestions();
        }
    }
    
    function rateConfidence(qid, rating) {
        if (rating === 'hard' || rating === 'guessed') {
            flaggedQids.add(qid);
        } else if (rating === 'knew') {
            flaggedQids.delete(qid);
        }
        updateFlaggedTabCount();
        saveState();
        const flagBtn = document.getElementById(`flag-${qid}`);
        if(flagBtn) flagBtn.classList.toggle('flagged', flaggedQids.has(qid));
        
        // Provide small visual feedback
        const fbBox = document.getElementById(`feedback_${qid}`);
        if(fbBox) {
            const existingAck = fbBox.querySelector('.conf-ack');
            if(existingAck) existingAck.remove();
            const ack = document.createElement('div');
            ack.className = 'conf-ack';
            ack.style.cssText = 'font-size:0.8rem; color:var(--correct-text); font-weight:bold; margin-top:8px;';
            ack.textContent = rating === 'knew' ? '✔ Marked as known (unflagged)' : '📌 Flagged for review';
            fbBox.appendChild(ack);
        }
    }

    function gradeExam() {
        if(!confirm("Are you sure you are ready to submit your exam? Unanswered questions will be marked as incorrect.")) return;
        
        activeQuestions.forEach(q => {
            let state = userState.get(q.qid);
            
            // If the user hasn't clicked anything for this question yet, initialize it
            if (!state) {
                state = { submitted: false, selected: [], score: 0 };
                userState.set(q.qid, state);
            }
            
            if(!state.submitted) {
                let correctSelected = 0;
                let incorrectSelected = 0;
                const totalCorrect = q.options.filter(o => o.correct).length;
                
                // If they selected options, grade normally
                if (state.selected && state.selected.length > 0) {
                    state.selected.forEach(idx => {
                        if (q.options[idx].correct) correctSelected++;
                        else incorrectSelected++;
                    });
                    state.score = Math.min(1, Math.max(0, (correctSelected - incorrectSelected) / totalCorrect));
                } else {
                    // If they left it blank, they get a 0
                    state.score = 0;
                }
                
                state.submitted = true;
                
                if (state.score < 1) incorrectQids.add(q.qid);
                else incorrectQids.delete(q.qid);
            }
        });

        examGraded = true;
        saveState();
        updateIncorrectTabCount();
        renderQuestions();
        updateScore();
        window.scrollTo(0,0);
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        
        if (currentLec === 'incorrect' && activeQuestions.length > 0) {
            const retryBtn = document.createElement('button');
            retryBtn.className = 'submit-q-btn';
            retryBtn.style.marginBottom = '20px';
            retryBtn.style.width = '100%';
            retryBtn.style.backgroundColor = 'var(--text-muted)';
            retryBtn.style.borderColor = 'var(--text-muted)';
            retryBtn.textContent = 'Retry All Incorrect Questions';
            retryBtn.onclick = () => {
                activeQuestions.forEach(q => {
                    userState.delete(q.qid);
                    incorrectQids.delete(q.qid);
                });
                setActiveQuestions('incorrect'); // Refresh active set which will now be empty
                renderQuestions();
                updateIncorrectTabCount();
                updateScore();
                saveState();
            };
            container.appendChild(retryBtn);
        }

        if (activeQuestions.length === 0) {
            container.innerHTML = '<p style="text-align:center; margin-top:40px; font-weight:600; color:var(--text-muted);">No questions to display here!</p>';
            return;
        }

        const letters = ['A', 'B', 'C', 'D', 'E'];
        
        // Carousel vs List determination
        let renderList = activeQuestions;
        if (carouselMode) {
            if(carouselIndex >= activeQuestions.length) carouselIndex = activeQuestions.length - 1;
            if(carouselIndex < 0) carouselIndex = 0;
            renderList = [activeQuestions[carouselIndex]];
        }

        // FLASHCARD MODE RENDERING
        if (flashcardMode) {
            renderList.forEach((q) => {
                const displayIndex = carouselMode ? carouselIndex : activeQuestions.indexOf(q);
                const state = userState.get(q.qid) || { submitted: false, selected: [], score: 0 };
                
                const card = document.createElement('div');
                card.className = 'flashcard-container';
                card.id = `qcard-${q.qid}`;
                
                const flagClass = flaggedQids.has(q.qid) ? 'flagged' : '';
                let correctTexts = q.options.filter(o => o.correct).map(o => o.text).join('<br><br>• ');
                
                card.innerHTML = `
                    <div class="flashcard-inner" id="fc-inner-${q.qid}">
                        <div class="flashcard-front">
                            <div class="q-header" style="width: 100%; position: absolute; top: 20px; left: 0; padding: 0 20px;">
                                <span class="q-num">Flashcard ${displayIndex + 1} of ${activeQuestions.length}</span>
                                <span class="q-cat">${q.type === 'sata' ? 'SATA' : 'MCQ'}</span>
                                <span id="flag-${q.qid}" class="flag-btn ${flagClass}" onclick="toggleFlag(${q.qid}, event)" title="Flag for review">📌</span>
                            </div>
                            <div class="q-text" style="font-size:1.3rem; margin-top:30px;">${escapeHTML(q.text)}</div>
                            <button class="submit-q-btn" style="margin-top:auto; padding: 12px 24px;" onclick="flipCard(${q.qid})">Flip Card (Spacebar)</button>
                        </div>
                        <div class="flashcard-back">
                            <h3 style="color:var(--correct-text); margin-bottom:15px;">Answer:</h3>
                            <p style="font-weight:bold; font-size:1.1rem; margin-bottom:20px;">• ${correctTexts}</p>
                            <div style="font-size:0.95rem; color:var(--text-muted); text-align:left; background: rgba(0,0,0,0.03); padding: 15px; border-radius: 8px;"><strong>Explanation:</strong> ${escapeHTML(q.explanation)}</div>
                            <div class="fc-btn-group">
                                <button class="submit-q-btn" style="background:var(--wrong-border); border-color:var(--wrong-border);" onclick="fcMissed(${q.qid})">🔴 Missed It (←)</button>
                                <button class="submit-q-btn" style="background:var(--correct-border); border-color:var(--correct-border);" onclick="fcKnew(${q.qid})">🟢 Knew It (→)</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            
            if (carouselMode && activeQuestions.length > 0) buildCarouselControls(container);
            return; // Exit render function early for flashcards
        }

        // STANDARD LIST/CAROUSEL RENDERING
        renderList.forEach((q, idxInList) => {
            const displayIndex = carouselMode ? carouselIndex : activeQuestions.indexOf(q);
            const state = userState.get(q.qid) || { submitted: false, selected: [], score: 0 };
            const card = document.createElement('div');
            card.className = 'q-card';
            card.id = `qcard-${q.qid}`;

            // Only apply grading colors if NOT in exam mode OR if exam is graded
            const showGrading = !examMode || examGraded;

            if (state.submitted && showGrading) {
                card.classList.add('answered');
                if (state.score === 1) card.classList.add('is-correct');
                else if (state.score > 0) card.classList.add('is-partial');
                else card.classList.add('is-wrong');
            }

            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                let extraClass = '';
                if (state.submitted && showGrading) {
                    if (opt.correct && state.score === 1) extraClass = 'user-correct';
                    else if (opt.correct) extraClass = 'reveal-correct';
                    else if (state.selected.includes(optIndex)) extraClass = 'user-wrong';
                } else if (state.selected.includes(optIndex)) {
                    extraClass = 'selected';
                }

                optionsHTML += `
                    <button type="button" class="opt-btn ${extraClass}"
                            ${state.submitted && showGrading ? 'disabled' : ''}
                            onclick="handleOptionClick(${q.qid}, ${optIndex})">
                        <span class="opt-prefix">${letters[optIndex]}.</span>
                        <span>${escapeHTML(opt.text)}</span>
                    </button>
                `;
            });

            const badge = q.type === 'sata' ? 'SATA' : 'MCQ';
            let submitDisabled = '';
            let buttonText = 'Submit Answer';
            
            if (examMode && !examGraded) {
                buttonText = carouselMode ? 'Save & Next' : 'Save Answer';
            } else if (state.submitted) {
                buttonText = 'Submitted';
                submitDisabled = 'disabled';
            } else {
                submitDisabled = state.selected.length === 0 ? 'disabled' : '';
            }
            
            const buttonHTML = `<button class="submit-q-btn" id="btn_${q.qid}" ${submitDisabled} onclick="submitAnswer(${q.qid})">${buttonText}</button>`;
            const flagClass = flaggedQids.has(q.qid) ? 'flagged' : '';

            card.innerHTML = `
                <div class="q-header">
                    <span class="q-num">Question ${displayIndex + 1} of ${activeQuestions.length}</span>
                    <span class="q-cat">${badge}</span>
                    <span id="flag-${q.qid}" class="flag-btn ${flagClass}" onclick="toggleFlag(${q.qid}, event)" title="Flag for review">📌</span>
                </div>
                <div class="q-text">${escapeHTML(q.text)}</div>
                <div class="opt-list">${optionsHTML}</div>
                ${buttonHTML}
                <div class="feedback-box" id="feedback_${q.qid}"></div>
            `;

            container.appendChild(card);
            
            if (state.submitted && showGrading) {
                showFeedback(q.qid, card.querySelector('.feedback-box'), q, state);
            }
        });
        
        if (carouselMode && activeQuestions.length > 0) buildCarouselControls(container);
    }
    
    function buildCarouselControls(container) {
        const cControls = document.createElement('div');
        cControls.className = 'carousel-controls';
        
        const prevDisabled = carouselIndex === 0 ? 'disabled' : '';
        const nextDisabled = carouselIndex === activeQuestions.length - 1 ? 'disabled' : '';
        
        cControls.innerHTML = `
            <button class="carousel-btn" ${prevDisabled} onclick="prevCarousel()">← Previous</button>
            <div class="carousel-tracker">${carouselIndex + 1} / ${activeQuestions.length}</div>
            <button class="carousel-btn" ${nextDisabled} onclick="nextCarousel()">Next →</button>
        `;
        container.appendChild(cControls);
        
        const hint = document.createElement('div');
        hint.className = 'keyboard-hint';
        hint.innerHTML = flashcardMode 
            ? 'Keyboard Shortcuts: <b>Spacebar</b> to flip • <b>←</b> Missed it • <b>→</b> Knew it'
            : 'Keyboard Shortcuts: <b>A B C D E</b> to select • <b>Enter</b> to submit • <b>Arrows</b> to navigate';
        container.appendChild(hint);
    }

    function handleOptionClick(qid, optIndex) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        if (!q) return;

        const existing = userState.get(qid) || { submitted: false, selected: [], score: 0 };
        // If in study mode and submitted, lock. If exam mode and graded, lock.
        if (existing.submitted && (!examMode || examGraded)) return;

        let selected;
        if (q.type === 'mcq') {
            selected = [optIndex];
        } else {
            selected = [...existing.selected];
            const index = selected.indexOf(optIndex);
            if (index >= 0) selected.splice(index, 1);
            else selected.push(optIndex);
        }

        userState.set(qid, { submitted: false, selected, score: 0 });
        saveState();
        renderQuestions();
    }

    function submitAnswer(qid) {
        if(examMode && !examGraded) {
            // In exam mode, we just want to advance the carousel if applicable
            if (carouselMode) nextCarousel();
            return; 
        }

        const q = shuffledQuestions.find(item => item.qid === qid);
        const state = userState.get(qid);
        if (!q || !state || state.selected.length === 0 || state.submitted) return;

        state.submitted = true;

        if (q.type === 'mcq') {
            state.score = q.options[state.selected[0]]?.correct ? 1 : 0;
        } else {
            const totalCorrect = q.options.filter(option => option.correct).length;
            let correctSelected = 0;
            let incorrectSelected = 0;

            state.selected.forEach(index => {
                if (q.options[index]?.correct) correctSelected++;
                else incorrectSelected++;
            });

            state.score = Math.min(1, Math.max(0, (correctSelected - incorrectSelected) / totalCorrect));
        }

        if (state.score < 1) {
            incorrectQids.add(qid);
        } else {
            incorrectQids.delete(q.qid);
        }
        
        userState.set(qid, state);
        saveState();
        updateIncorrectTabCount();
        updateScore();
        renderQuestions();
    }

    function showFeedback(qid, fbBox, q, state) {
        if (!fbBox) return;

        let statusClass = 'incorrect';
        let titleText = '✗ Incorrect';

        if (state.score === 1) {
            statusClass = 'correct';
            titleText = '✓ Correct!';
        } else if (state.score > 0) {
            statusClass = 'partial';
            titleText = `Partial Credit (+${state.score.toFixed(2)})`;
        }

        // Do not add confidence ratings in exam mode
        let confidenceHTML = '';
        if (!examMode) {
            confidenceHTML = `
                <div class="conf-btn-group">
                    <span style="font-size:0.8rem; color:var(--text-muted);">Confidence:</span>
                    <button class="conf-btn" onclick="rateConfidence(${q.qid}, 'hard')">🟥 Hard</button>
                    <button class="conf-btn" onclick="rateConfidence(${q.qid}, 'guessed')">🟨 Guessed</button>
                    <button class="conf-btn" onclick="rateConfidence(${q.qid}, 'knew')">🟩 Knew It</button>
                </div>
            `;
        }

        fbBox.className = `feedback-box ${statusClass}`;
        fbBox.style.display = 'block';
        fbBox.innerHTML = `
            <div class="feedback-title">${titleText}</div>
            <div class="explanation">${escapeHTML(q.explanation)}</div>
            ${confidenceHTML}
        `;
    }

    function escapeHTML(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    // Carousel Navigation
    function prevCarousel() {
        if (carouselIndex > 0) {
            carouselIndex--;
            renderQuestions();
        }
    }
    function nextCarousel() {
        if (carouselIndex < activeQuestions.length - 1) {
            carouselIndex++;
            renderQuestions();
        }
    }
    
    // Flashcard Logic
    function flipCard(qid) {
        document.getElementById(`fc-inner-${qid}`).classList.add('flipped');
    }
    function fcMissed(qid) {
        let state = userState.get(qid) || { submitted: false, selected: [], score: 0 };
        state.submitted = true;
        state.score = 0;
        incorrectQids.add(qid);
        userState.set(qid, state);
        saveState();
        updateIncorrectTabCount();
        updateScore();
        nextCarousel();
    }
    function fcKnew(qid) {
        let state = userState.get(qid) || { submitted: false, selected: [], score: 0 };
        state.submitted = true;
        state.score = 1;
        incorrectQids.delete(qid);
        userState.set(qid, state);
        saveState();
        updateIncorrectTabCount();
        updateScore();
        nextCarousel();
    }

    // Feature Toggles
    function toggleTheme(forceDark) {
        if (forceDark !== undefined) {
            if(forceDark) document.body.classList.add('dark-mode');
            else document.body.classList.remove('dark-mode');
        } else {
            document.body.classList.toggle('dark-mode');
        }
        const isDark = document.body.classList.contains('dark-mode');
        const btn = document.getElementById('themeToggleBtn');
        if(btn) btn.innerHTML = isDark ? '🌙 Dark' : '☀️ Light';
        saveState();
    }

    function toggleLayout(forceCarousel) {
        if (forceCarousel !== undefined) carouselMode = forceCarousel;
        else carouselMode = !carouselMode;
        
        if (!carouselMode && flashcardMode) {
            toggleFlashcardMode(false); // Can't have list view in flashcard mode
        }
        
        const btn = document.getElementById('layoutToggleBtn');
        if(btn) {
            btn.innerHTML = carouselMode ? '🔄 Carousel' : '📜 List';
            btn.classList.toggle('active', carouselMode);
        }
        renderQuestions();
        saveState();
    }
    
    function toggleFlashcardMode(forceFC) {
        if (forceFC !== undefined) flashcardMode = forceFC;
        else flashcardMode = !flashcardMode;
        
        const btn = document.getElementById('flashcardToggleBtn');
        if(btn) {
            btn.innerHTML = flashcardMode ? '📇 Flashcards: ON' : '📇 Flashcards';
            btn.classList.toggle('active', flashcardMode);
        }
        
        if (flashcardMode) {
            if (examMode) toggleExamMode(false); // Turn off exam mode for flashcards
            if (!carouselMode) toggleLayout(true); // Force carousel for flashcards
        }
        
        saveState();
        renderQuestions();
    }

    function toggleExamMode(forceExam) {
        if(forceExam !== undefined) {
            examMode = forceExam;
        } else {
            examMode = !examMode;
        }
        examGraded = false; 
        
        if (examMode && flashcardMode) toggleFlashcardMode(false);
        
        const btn = document.getElementById('modeToggleBtn');
        if(btn) {
            btn.innerHTML = examMode ? '🎓 Exam' : '📖 Study';
            btn.classList.toggle('active', examMode);
        }
        
        saveState();
        updateIncorrectTabCount();
        updateScore();
        renderQuestions();
    }
    
    // Timer Functions
    function toggleTimer() {
        const display = document.getElementById('timerDisplay');
        const btn = document.getElementById('timerToggleBtn');
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            display.style.display = 'none';
            btn.classList.remove('active');
        } else {
            // Allocate 60 seconds per active question
            timeLeft = activeQuestions.length * 60;
            display.style.display = 'block';
            btn.classList.add('active');
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("Time is up! Grading your exam automatically.");
                    if(examMode && !examGraded) gradeExam();
                }
            }, 1000);
        }
    }
    
    function updateTimerDisplay() {
        const display = document.getElementById('timerDisplay');
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        display.textContent = `${m}:${s}`;
        if (timeLeft < 60) display.style.color = '#ef4444'; // turn red in final minute
        else display.style.color = 'inherit';
    }
    
    // Analytics Modal Functions
    function openAnalytics() {
        const modal = document.getElementById('analyticsModal');
        const body = document.getElementById('analyticsBody');
        
        const lecs = ['5', '6', '7', '8', 'bar'];
        let html = '<table style="width:100%; text-align:left; border-collapse:collapse; margin-top:10px;">';
        html += '<tr style="border-bottom:2px solid var(--border-color);"><th style="padding:8px 0;">Section</th><th>Accuracy</th><th>Progress</th></tr>';
        
        let totalCorrect = 0;
        let totalSub = 0;

        lecs.forEach(lec => {
            const qs = shuffledQuestions.filter(q => String(q.lec) === lec);
            let correct = 0;
            let submitted = 0;
            qs.forEach(q => {
                const st = userState.get(q.qid);
                if(st && st.submitted) {
                    submitted++;
                    correct += st.score;
                }
            });
            totalSub += submitted;
            totalCorrect += correct;
            
            const acc = submitted > 0 ? Math.round((correct/submitted)*100) : 0;
            const prog = Math.round((submitted/qs.length)*100);
            
            let lecName = lec;
            if(lec==='5') lecName = 'Infection';
            if(lec==='6') lecName = 'Control';
            if(lec==='7') lecName = 'Antibiotics';
            if(lec==='8') lecName = 'Antivirals/Superbugs';
            if(lec==='bar') lecName = 'BAR Article';
            
            html += `<tr style="border-bottom:1px solid var(--border-color);">
                <td style="padding:10px 0; font-weight:600;">${lecName}</td>
                <td style="color:${acc > 75 ? 'var(--correct-text)' : 'var(--wrong-text)'}; font-weight:bold;">${acc}%</td>
                <td>${prog}% <span style="font-size:0.8rem; color:var(--text-muted);">(${submitted}/${qs.length})</span></td>
            </tr>`;
        });
        
        const overallAcc = totalSub > 0 ? Math.round((totalCorrect/totalSub)*100) : 0;
        html += `<tr style="background:rgba(0,0,0,0.03);">
            <td style="padding:12px 0; font-weight:800;">OVERALL</td>
            <td style="font-weight:800;">${overallAcc}%</td>
            <td style="font-weight:800;">${Math.round((totalSub/shuffledQuestions.length)*100)}%</td>
        </tr>`;
        
        html += '</table>';
        body.innerHTML = html;
        modal.style.display = 'flex';
    }

    function closeAnalytics() {
        document.getElementById('analyticsModal').style.display = 'none';
    }
    
    // Custom Quiz Builder Functions
    function openCustomQuiz() {
        document.getElementById('customQuizModal').style.display = 'flex';
    }
    
    function closeCustomQuiz() {
        document.getElementById('customQuizModal').style.display = 'none';
    }
    
    function generateCustomQuiz() {
        const count = parseInt(document.getElementById('cqCount').value) || 20;
        const lecs = Array.from(document.querySelectorAll('.cq-lec:checked')).map(cb => cb.value);
        const status = document.getElementById('cqStatus').value;
        
        let pool = shuffledQuestions.filter(q => lecs.includes(String(q.lec)));
        
        if (status === 'unanswered') {
            pool = pool.filter(q => {
                const st = userState.get(q.qid);
                return !st || !st.submitted;
            });
        } else if (status === 'incorrect') {
            pool = pool.filter(q => incorrectQids.has(q.qid));
        }
        
        pool = shuffleArray(pool).slice(0, count);
        
        if (pool.length === 0) {
            alert("No questions match your criteria! Try a different combination.");
            return;
        }
        
        customQuizQids = pool.map(q => q.qid);
        
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        const customBtn = document.querySelector('[data-lec="custom"]');
        if(customBtn) customBtn.classList.add('active');
        
        closeCustomQuiz();
        setActiveQuestions('custom');
        if(!carouselMode) toggleLayout(true); // Default custom quizzes to carousel
        renderQuestions();
        updateScore();
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
        if(activeQuestions.length === 0) return;
        
        // Flashcard Mode Shortcuts
        if (flashcardMode && carouselMode) {
            const q = activeQuestions[carouselIndex];
            const fcInner = document.getElementById(`fc-inner-${q.qid}`);
            if (!fcInner) return;
            const isFlipped = fcInner.classList.contains('flipped');
            
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent page scroll
                if(!isFlipped) flipCard(q.qid);
            } else if (e.code === 'ArrowLeft') {
                if (isFlipped) fcMissed(q.qid);
                else prevCarousel();
            } else if (e.code === 'ArrowRight') {
                if (isFlipped) fcKnew(q.qid);
                else nextCarousel();
            }
            return;
        }

        // Standard Carousel Shortcuts
        if(!carouselMode) return;
        
        const q = activeQuestions[carouselIndex];
        const state = userState.get(q.qid) || {};
        const isLocked = state.submitted && (!examMode || examGraded);

        const key = e.key.toLowerCase();
        const optMap = {'a':0, 'b':1, 'c':2, 'd':3, 'e':4};

        if(key in optMap && optMap[key] < q.options.length) {
            if(!isLocked) handleOptionClick(q.qid, optMap[key]);
        } else if(key === 'enter') {
            if (!isLocked && (!examMode || examGraded)) {
                submitAnswer(q.qid);
            } else if (examMode && !examGraded) {
                nextCarousel(); // In exam mode, enter just goes next
            }
        } else if(key === 'arrowleft') {
            prevCarousel();
        } else if(key === 'arrowright') {
            nextCarousel();
        }
    });

    // Close Modals on Outside Click
    window.onclick = function(event) {
        const analyticsModal = document.getElementById('analyticsModal');
        const cqModal = document.getElementById('customQuizModal');
        if (event.target == analyticsModal) closeAnalytics();
        if (event.target == cqModal) closeCustomQuiz();
    }

    document.getElementById('navTabs').addEventListener('click', event => {
        const button = event.target.closest('.filter-btn');
        if (!button) return;
        filterQuestions(button.dataset.lec, button);
    });

    document.getElementById('resetBtn').addEventListener('click', resetAttempt);

    // Boot
    init();

    </script>
</body>
