<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MICR1500 Term Test 2 Practice Exam</title>
  <style>
:root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct-border: #16a34a;
            --correct-bg: #f0fdf4;
            --correct-text: #15803d;
            --wrong-border: #dc2626;
            --wrong-bg: #fef2f2;
            --wrong-text: #b91c1c;
            --partial-border: #d97706;
            --partial-bg: #fffbeb;
            --partial-text: #92400e;
            --border-color: #e2e8f0;
            --selected-border: #93c5fd;
            --selected-bg: #eff6ff;
        }

        body.dark-mode {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --selected-bg: #1e3a8a;
            --selected-border: #3b82f6;
            --correct-bg: #064e3b;
            --correct-border: #059669;
            --correct-text: #34d399;
            --wrong-bg: #7f1d1d;
            --wrong-border: #dc2626;
            --wrong-text: #fca5a5;
            --partial-bg: #78350f;
            --partial-border: #d97706;
            --partial-text: #fcd34d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 80px; /* space for grade bar */
        }

        /* Sticky Header */
        header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            padding: 12px 16px;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-title {
            min-width: 0;
        }

        .header-title h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-title p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .score-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s ease;
        }
        .toggle-btn:hover { background: rgba(255, 255, 255, 0.25); }
        .toggle-btn.active { background: var(--accent); border-color: var(--accent); }

        /* Navigation / Filter Bar */
        .nav-bar {
            max-width: 900px;
            margin: 16px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-bar::-webkit-scrollbar { display: none; }

        .filter-btn,
        .reset-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .filter-btn:hover,
        .reset-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* Dark Mode Button Adjustments */
        body.dark-mode .filter-btn, body.dark-mode .reset-btn {
            background: var(--card-bg);
            color: var(--text-muted);
        }
        body.dark-mode .filter-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }
        body.dark-mode .q-cat { background: #334155; color: #cbd5e1; }
        body.dark-mode .opt-btn { background: var(--card-bg); }
        body.dark-mode .opt-btn:hover:not(:disabled) { background: #334155; border-color: #475569; }
        body.dark-mode .opt-btn:active:not(:disabled) { background: #0f172a; }

        /* Main Container */
        main {
            max-width: 800px;
            margin: 16px auto;
            padding: 0 16px;
        }

        /* Question Cards */
        .q-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            position: relative;
        }

        .q-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .q-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .q-cat {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .flag-btn {
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.3;
            transition: all 0.2s;
            margin-left: auto;
            margin-right: 10px;
        }
        .flag-btn:hover { opacity: 0.7; }
        .flag-btn.flagged {
            opacity: 1;
            filter: drop-shadow(0 0 2px #eab308);
        }

        .q-text {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.45;
        }

        /* Options */
        .opt-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opt-btn {
            display: flex;
            align-items: flex-start;
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .opt-btn:active:not(:disabled) { background-color: #f1f5f9; }

        .opt-prefix {
            font-weight: 700;
            margin-right: 8px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .opt-btn.selected {
            border-color: var(--selected-border);
            background: var(--selected-bg);
            color: #1d4ed8;
        }

        .q-card.answered .opt-btn {
            cursor: default;
            pointer-events: none;
            opacity: 0.6;
        }

        .q-card.answered .opt-btn.user-correct,
        .q-card.answered .opt-btn.reveal-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        .q-card.answered .opt-btn.user-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        /* Submit */
        .submit-q-btn {
            margin-top: 14px;
            padding: 9px 14px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }

        .submit-q-btn:hover:not(:disabled) { opacity: 0.92; }
        .submit-q-btn:active:not(:disabled) { transform: scale(0.98); }
        .submit-q-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .feedback-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .feedback-box.correct { background-color: var(--correct-bg); border-left: 4px solid var(--correct-border); color: var(--correct-text); }
        .feedback-box.incorrect { background-color: var(--wrong-bg); border-left: 4px solid var(--wrong-border); color: var(--wrong-text); }
        .feedback-box.partial { background-color: var(--partial-bg); border-left: 4px solid var(--partial-border); color: var(--partial-text); }
        .feedback-title { font-weight: 700; margin-bottom: 4px; }
        .explanation { margin-top: 4px; color: inherit; }

        /* New Features CSS */
        .flashcard-container { perspective: 1000px; width: 100%; min-height: 400px; margin-bottom: 16px; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; min-height: 400px; }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; overflow-y: auto; }
        .flashcard-front { align-items: center; justify-content: center; }
        .flashcard-back { transform: rotateY(180deg); align-items: center; justify-content: flex-start; }
        .fc-btn-group { display: flex; gap: 16px; margin-top: auto; width: 100%; justify-content: center; padding-top: 20px;}
        
        .search-bar-container { max-width: 900px; margin: 16px auto 0; padding: 0 16px; }
        .search-bar { width: 100%; padding: 10px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 0.95rem; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); color: var(--text-main); padding: 24px; border-radius: 12px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-close { float: right; cursor: pointer; font-size: 1.5rem; font-weight: bold; color: var(--text-muted); line-height: 1; }
        .modal-close:hover { color: var(--wrong-text); }
        
        .conf-btn-group { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
        .conf-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg); cursor: pointer; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
        .conf-btn:hover { background: var(--border-color); }
        
        .timer-display { font-weight: bold; color: var(--wrong-text); font-size: 1rem; padding: 6px 12px; background: rgba(255,255,255,0.12); border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }

        /* Carousel Controls */
        .carousel-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }
        .carousel-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .carousel-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .carousel-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .carousel-tracker { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }

        /* Exam Mode Bar */
        .exam-grade-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            padding: 15px;
            text-align: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            z-index: 100;
            display: none;
        }
        .exam-grade-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1);
        }

        .keyboard-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 10px;
        }

        @media (max-width: 640px) {
            header { padding: 10px 12px; }
            .header-title h1 { font-size: 1rem; }
            .header-title p { font-size: 0.7rem; }
            .score-badge, .toggle-btn, .timer-display { padding: 5px 10px; font-size: 0.75rem; }
            .nav-bar { padding: 0 12px; margin-top: 12px; }
            main { margin-top: 12px; padding: 0 12px; }
            .q-card { padding: 16px; }
            .q-text { font-size: 0.95rem; }
            .opt-btn { font-size: 0.9rem; padding: 11px 12px; }
            .flashcard-container { min-height: 450px; }
            .flashcard-inner { min-height: 450px; }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <div class="header-title">
                <h1>MICR1500 Term Test 2 Practice Exam</h1>
                <p id="header-subtitle">173 Questions • Lectures 5 - 8 + BAR Article</p>
            </div>
            <div class="header-controls">
                <button id="themeToggleBtn" class="toggle-btn" onclick="toggleTheme()">☀️ Light</button>
                <button id="layoutToggleBtn" class="toggle-btn" onclick="toggleLayout()">📜 List</button>
                <button id="modeToggleBtn" class="toggle-btn" onclick="toggleExamMode()">📖 Study</button>
                <button id="flashcardToggleBtn" class="toggle-btn" onclick="toggleFlashcardMode()">📇 Flashcards</button>
                <button id="timerToggleBtn" class="toggle-btn" onclick="toggleTimer()">⏱️ Timer</button>
                <button class="toggle-btn" onclick="openAnalytics()">📊 Analytics</button>
                <div id="timerDisplay" class="timer-display" style="display:none;">00:00</div>
                <div class="score-badge" id="score-counter">Grade: 0%</div>
            </div>
        </div>
    </header>

    <div class="search-bar-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search keywords (e.g. penicillin, macrophage, DNA)..." oninput="handleSearch()">
    </div>

    <div class="nav-bar" id="navTabs">
        <button class="filter-btn active" data-lec="all" type="button" id="tab-all">All (173)</button>
        <button class="filter-btn" data-lec="quick20" type="button" style="color:var(--accent); border-color:var(--accent);">⚡ Quick 20</button>
        <button class="filter-btn" data-lec="custom" type="button" onclick="openCustomQuiz()" style="color:#d946ef; border-color:#d946ef;">🛠️ Custom Quiz</button>
        <button class="filter-btn" data-lec="5" type="button" id="tab-5">Lec 5: Infection (44)</button>
        <button class="filter-btn" data-lec="6" type="button" id="tab-6">Lec 6: Control (39)</button>
        <button class="filter-btn" data-lec="7" type="button" id="tab-7">Lec 7: Antibiotics (35)</button>
        <button class="filter-btn" data-lec="8" type="button" id="tab-8">Lec 8: Antivirals (39)</button>
        <button class="filter-btn" data-lec="bar" type="button" id="tab-bar">BAR Article (16)</button>
        <button class="filter-btn" data-lec="flagged" type="button" id="tab-flagged" style="color:#ca8a04; border-color:#facc15;">📌 Flagged (0)</button>
        <button class="filter-btn" data-lec="incorrect" type="button" id="tab-incorrect" style="color:var(--wrong-text); border-color:var(--wrong-border);">Review Incorrect (0)</button>
        <button class="reset-btn" id="resetBtn" type="button">Reset Progress</button>
    </div>

    <main id="questionsContainer"></main>

    <div class="exam-grade-bar" id="examGradeBar">
        <button class="exam-grade-btn" onclick="gradeExam()">Grade My Exam Now</button>
    </div>

    <!-- Modals -->
    <div id="analyticsModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="closeAnalytics()">&times;</span>
            <h2 style="margin-bottom: 10px; color:var(--primary);">📊 Performance Analytics</h2>
            <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom: 20px;">Review your accuracy broken down by individual lecture topics.</p>
            <div id="analyticsBody"></div>
        </div>
    </div>

    <div id="customQuizModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="closeCustomQuiz()">&times;</span>
            <h2 style="margin-bottom: 20px; color:var(--primary);">🛠️ Custom Quiz Builder</h2>
            <label style="font-weight:600;">Number of Questions: <input type="number" id="cqCount" value="20" min="1" max="173" style="width:60px; padding:4px; margin-left:8px; border-radius:4px; border:1px solid var(--border-color);"></label><br><br>
            
            <label style="font-weight:600;">Include Lectures:</label><br>
            <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
                <label><input type="checkbox" class="cq-lec" value="5" checked> Lec 5: Infection & Epidemiology</label>
                <label><input type="checkbox" class="cq-lec" value="6" checked> Lec 6: Control of Microbes</label>
                <label><input type="checkbox" class="cq-lec" value="7" checked> Lec 7: Antibiotics</label>
                <label><input type="checkbox" class="cq-lec" value="8" checked> Lec 8: Antivirals & Superbugs</label>
                <label><input type="checkbox" class="cq-lec" value="bar" checked> Bacterial Antibiotic Resistance Article</label>
            </div><br>
            
            <label style="font-weight:600;">Question Status:</label><br>
            <select id="cqStatus" style="width:100%; padding:8px; margin-top:8px; border-radius:6px; border:1px solid var(--border-color);">
                <option value="all">All Questions</option>
                <option value="unanswered">Unanswered Only</option>
                <option value="incorrect">Incorrect Only</option>
            </select><br><br>
            
            <button class="submit-q-btn" style="width:100%;" onclick="generateCustomQuiz()">Start Custom Quiz</button>
        </div>
    </div>

    <script>
    // ==========================================
    // QUESTION BANK (173 Questions)
    // ==========================================
    const questionBank = [
      // LECTURE 5: Infection & Epidemiology
      { lec:5, type:"mcq", text:"Two organisms live together and both benefit, as with E. coli in the human gut. This relationship is called:", options:[{text:"Commensalism",correct:false},{text:"Mutualism",correct:true},{text:"Synergism",correct:false},{text:"Parasitism",correct:false}], explanation:"Both benefit = mutualism. Commensalism leaves one partner unaffected; synergism is 1+1=3; parasitism harms one partner." },
      { lec:5, type:"mcq", text:"Trench mouth is an example of microbes together causing more harm than either alone (1+1 = 3). This is:", options:[{text:"Mutualism",correct:false},{text:"Commensalism",correct:false},{text:"Synergism",correct:true},{text:"Parasitism",correct:false}], explanation:"Organisms that do more together than alone (1+1=3) is defined as synergism." },
      { lec:5, type:"mcq", text:"Which body site should normally be free of resident microbes (sterile)?", options:[{text:"Large intestine",correct:false},{text:"Skin",correct:false},{text:"Mouth",correct:false},{text:"Central nervous system",correct:true}], explanation:"The CNS (like blood, internal organs, and bladder) should be sterile. Intestine, skin and mouth have normal flora." },
      { lec:5, type:"sata", text:"Which of the following represents a position on or in the human body that has normal flora? (SATA)", options:[{text:"Nose",correct:true},{text:"Surface of skin",correct:true},{text:"Stomach",correct:false},{text:"Small intestine",correct:true},{text:"Large intestine",correct:true}], explanation:"Nose, skin, small and large intestines have normal flora. The stomach has no normal flora (though it may not be completely sterile)." },
      { lec:5, type:"mcq", text:"Which organism and site produce vitamin K needed for blood clotting?", options:[{text:"Staphylococci on the skin",correct:false},{text:"Lactobacilli in the genital tract",correct:false},{text:"E. coli in the large intestine",correct:true},{text:"Spirochetes in the mouth",correct:false}], explanation:"E. coli in the large intestine makes vitamin K, which is necessary for blood clotting." },
      { lec:5, type:"mcq", text:"Urinary tract infections, yeast vaginitis and colitis are usually the result of:", options:[{text:"Destruction or translocation of normal flora",correct:true},{text:"Acquisition of flora at birth",correct:false},{text:"The beneficial effects of normal flora",correct:false},{text:"A fetus being exposed to microbes in the womb",correct:false}], explanation:"Destruction or translocation of normal flora usually results in opportunistic infections like UTIs or yeast vaginitis." },
      { lec:5, type:"mcq", text:"HIV versus AIDS illustrates that:", options:[{text:"Infection and disease are the same thing",correct:false},{text:"A person can be infected without having the disease",correct:true},{text:"Disease always comes before infection",correct:false},{text:"Pathogenicity is the same as incubation",correct:false}], explanation:"Infection means invasion by a pathogen; disease means a change from good health. A person can be infected with HIV without having the disease (AIDS)." },
      { lec:5, type:"mcq", text:"Which statement correctly defines virulence?", options:[{text:"Ability of a microbe to live in a host without harm",correct:false},{text:"The first or original illness",correct:false},{text:"Any change from a state of good health",correct:false},{text:"The degree of pathogenicity",correct:true}], explanation:"Virulence is the degree of pathogenicity ('full of poison')." },
      { lec:5, type:"mcq", text:"A child has a measles rash at the hairline and face at the peak of illness. Which stage is this?", options:[{text:"Acme, the most communicable period",correct:true},{text:"Prodromal period",correct:false},{text:"Decline period",correct:false},{text:"Convalescent period",correct:false}], explanation:"A characteristic rash with peak symptoms is the acme, the most transmissible (communicable) period." },
      { lec:5, type:"mcq", text:"Which disease below has the longest incubation period?", options:[{text:"Influenza",correct:false},{text:"Hepatitis B",correct:false},{text:"Syphilis",correct:false},{text:"Leprosy",correct:true}], explanation:"Leprosy takes 10 to >30 years to incubate." },
      { lec:5, type:"mcq", text:"Symptoms are decreasing and the patient is sweating after a fever. Which stage is this?", options:[{text:"Incubation",correct:false},{text:"Acme",correct:false},{text:"Decline",correct:true},{text:"Convalescence",correct:false}], explanation:"Decreasing symptoms and sweating after fever indicates the decline period." },
      { lec:5, type:"mcq", text:"You are advising someone who does not have SARS-CoV-2 infection, but is living with someone who is infected. During which of the following stages of the infectious disease can you tell them the virus is NOT transmissible?", options:[{text:"Incubation",correct:false},{text:"Prodromal",correct:false},{text:"Acme",correct:false},{text:"Decline",correct:false},{text:"None of the above",correct:true}], explanation:"The virus is transmissible during ALL stages of the disease, including incubation and convalescence." },
      { lec:5, type:"mcq", text:"Which of the following is an example of indirect (vehicle) transmission?", options:[{text:"Kissing",correct:false},{text:"A bite from a rabid dog",correct:false},{text:"Touching a contaminated doorknob (fomite)",correct:true},{text:"Rubella passed from mother to fetus",correct:false}], explanation:"A doorknob is an inanimate object (fomite), which is a form of indirect/vehicle transmission. Kissing, animal bites, and congenital transfer are direct." },
      { lec:5, type:"mcq", text:"Larger respiratory droplets (>5-10 µm) typically fall to the ground within about:", options:[{text:"10 cm",correct:false},{text:"1-2 m",correct:true},{text:"7-8 m",correct:false},{text:"20 m",correct:false}], explanation:"Larger droplets fall within 1-2 m; whereas the smaller sneeze gas cloud can travel 7-8 m." },
      { lec:5, type:"mcq", text:"A mosquito that carries West Nile virus from one host to another is a:", options:[{text:"Vector",correct:true},{text:"Fomite",correct:false},{text:"Asymptomatic carrier",correct:false},{text:"Nonliving reservoir",correct:false}], explanation:"Mosquitoes are live arthropods acting as vectors." },
      { lec:5, type:"sata", text:"Which of the following is/are true for modes of transmission of infectious diseases? (SATA)", options:[{text:"Direct transmission can include inhalation of respiratory droplets",correct:true},{text:"During a sneeze, the turbulent gas can travel for up to one or two meters",correct:false},{text:"Mosquitoes carrying malaria is an example of biological vector transmission",correct:true},{text:"A classmate shared their pencil with you for term test 2. Influenza virus was on that pencil which causes you to test positive for influenza within 2 days. This is an example of fomite transmission.",correct:true}], explanation:"Direct transmission includes inhalation. Mosquitoes are biological vectors. A shared pencil is a fomite. Sneeze gas clouds travel 7-8 meters, not 1-2 meters." },
      { lec:5, type:"mcq", text:"A human carrier of a pathogen is best described as someone who:", options:[{text:"Has severe symptoms and is only infectious at the acme",correct:false},{text:"Is an inanimate object that carries pathogens",correct:false},{text:"Is an arthropod that transmits disease",correct:false},{text:"Is colonized, shows no symptoms, and can spread the disease",correct:true}], explanation:"Carriers are colonized by a pathogen, remain asymptomatic, and can spread disease to many people." },
      { lec:5, type:"mcq", text:"Rubella passed from a pregnant mother to her fetus across the placenta is an example of:", options:[{text:"Droplet transmission",correct:false},{text:"Congenital transfer",correct:true},{text:"Vector-borne transmission",correct:false},{text:"Fomite transmission",correct:false}], explanation:"Mother-to-child transmission via the placenta (rubella) or birth canal (herpes) is congenital transfer." },
      { lec:5, type:"mcq", text:"Incidence is calculated as:", options:[{text:"All cases (old and new) divided by the number of people at risk",correct:false},{text:"New cases divided by the number of people at risk",correct:true},{text:"Deaths divided by the number of people at risk",correct:false},{text:"Old cases divided by new cases",correct:false}], explanation:"Incidence measures new cases divided by the number at risk. Option A defines prevalence." },
      { lec:5, type:"mcq", text:"Which relationship regarding epidemiological measurements is always true?", options:[{text:"Prevalence > incidence",correct:true},{text:"Incidence > prevalence",correct:false},{text:"Mortality rate > incidence",correct:false},{text:"Prevalence < mortality rate",correct:false}], explanation:"Prevalence (old + new) is always strictly greater than incidence (new only)." },
      { lec:5, type:"mcq", text:"A disease that is constantly present at a low level in a geographical area (e.g., the common cold) is:", options:[{text:"Sporadic",correct:false},{text:"Epidemic",correct:false},{text:"Endemic",correct:true},{text:"Pandemic",correct:false}], explanation:"Constant low-level presence in an area is defined as endemic." },
      { lec:5, type:"mcq", text:"An epi curve shows sequential humps that grow over time from an index case. This indicates:", options:[{text:"A point-source outbreak",correct:false},{text:"A continuing-source outbreak",correct:false},{text:"A disseminated (propagated) person-to-person outbreak",correct:true},{text:"An endemic baseline",correct:false}], explanation:"Sequential growing humps signify a disseminated (propagated) person-to-person spread." },
      { lec:5, type:"mcq", text:"We've studied several epi curves related to SARS transmission. All of these curves demonstrate:", options:[{text:"A continuing source transmission",correct:false},{text:"An intermittent transmission",correct:false},{text:"Disseminated transmission with propagated spread",correct:true},{text:"No transmission",correct:false}], explanation:"SARS is spread person-to-person, creating a disseminated (propagated) epi curve with sequential humps." },
      { lec:5, type:"mcq", text:"According to the WHO, a pandemic requires:", options:[{text:"Any outbreak in a single country",correct:false},{text:"A few scattered sporadic cases",correct:false},{text:"An epidemic confined to one WHO region",correct:false},{text:"Community-level spread in multiple countries in two or more WHO regions",correct:true}], explanation:"The WHO defines a pandemic as community-level spread in multiple countries in at least two or more WHO regions." },
      { lec:5, type:"mcq", text:"Which of the following is a non-communicable disease?", options:[{text:"Tetanus",correct:true},{text:"Chlamydia",correct:false},{text:"Cholera",correct:false},{text:"MRSA",correct:false}], explanation:"Tetanus cannot spread from person to person. Chlamydia, cholera, and MRSA are highly communicable." },
      { lec:5, type:"mcq", text:"Virus present in the bloodstream is called:", options:[{text:"Bacteremia",correct:false},{text:"Septicemia",correct:false},{text:"A local infection",correct:false},{text:"Viremia",correct:true}], explanation:"Viremia = virus in blood; bacteremia/septicemia = bacteria in blood." },
      { lec:5, type:"mcq", text:"Pneumonia that develops in a weakened patient following influenza is a:", options:[{text:"Primary infection",correct:false},{text:"Secondary infection",correct:true},{text:"Chronic infection",correct:false},{text:"Local infection only",correct:false}], explanation:"A new infection in a weakened person following a prior infection is a secondary infection." },
      { lec:5, type:"mcq", text:"Which list gives the top three nosocomial infection types in the correct order with correct percentages?", options:[{text:"UTI 40%, surgical sites 19%, respiratory 15%",correct:true},{text:"Respiratory 40%, UTI 19%, surgical sites 15%",correct:false},{text:"Surgical sites 40%, UTI 19%, skin 15%",correct:false},{text:"UTI 40%, respiratory 19%, surgical sites 15%",correct:false}], explanation:"Correct order is UTI (40%) > surgical sites (19%) > respiratory (15%)." },
      { lec:5, type:"mcq", text:"The most important control measure for nosocomial infections is:", options:[{text:"Giving prophylactic antibiotics to every patient",correct:false},{text:"Isolating all hospital staff",correct:false},{text:"Universal precautions, including proper handwashing",correct:true},{text:"Eliminating every patient's normal flora",correct:false}], explanation:"Universal precautions combined with proper handwashing is the primary control measure." },
      { lec:5, type:"mcq", text:"Which organism has the lowest infectious dose (fewest organisms needed to cause infection)?", options:[{text:"Typhoid bacilli",correct:false},{text:"Cholera bacteria",correct:false},{text:"Typical E. coli",correct:false},{text:"E. coli O157:H7",correct:true}], explanation:"E. coli O157:H7 and TB need < 10 organisms. Typhoid needs ~200,000; Cholera ~2M." },
      { lec:5, type:"sata", text:"From the following list of bacterial extracellular enzymes, choose the one(s) that dissolve blood clots OR destroy white blood cells. (SATA)", options:[{text:"Coagulase",correct:false},{text:"Streptokinase",correct:true},{text:"Hyaluronidase",correct:false},{text:"Leukocidin",correct:true},{text:"Hemolysin",correct:false}], explanation:"Streptokinase dissolves blood clots. Leukocidin destroys white blood cells. Coagulase forms clots, hyaluronidase dissolves tissue glue, and hemolysin destroys red blood cells." },
      { lec:5, type:"mcq", text:"Which enzyme dissolves 'tissue glue' and helps flesh-eating strep and gas gangrene spread rapidly?", options:[{text:"Coagulase",correct:false},{text:"Hemolysin",correct:false},{text:"Hyaluronidase",correct:true},{text:"Leukocidin",correct:false}], explanation:"Hyaluronidase dissolves hyaluronic acid (tissue glue), allowing for rapid spread." },
      { lec:5, type:"mcq", text:"A toxin that is LPS, is released when a Gram-negative cell dies, has low potency and nonspecific effects is a(n):", options:[{text:"Endotoxin",correct:true},{text:"Exotoxin",correct:false},{text:"Adhesin",correct:false},{text:"Coagulase",correct:false}], explanation:"Endotoxins are Lipopolysaccharides (LPS) released upon cell death, found in Gram-negative bacteria, and have low potency." },
      { lec:5, type:"mcq", text:"Clusters of virulence genes called pathogenicity islands are transferred between bacteria by:", options:[{text:"Binary fission",correct:false},{text:"Mutation only",correct:false},{text:"Vaccination",correct:false},{text:"Horizontal gene transfer (e.g., plasmids and sex pili)",correct:true}], explanation:"Pathogenicity islands move by horizontal gene transfer, such as through plasmids and sex pili." },
      { lec:5, type:"sata", text:"During which of the following stages of infectious disease is the microbe transmissible? (SATA)", options:[{text:"Incubation period",correct:true},{text:"Period of prodromal symptoms",correct:true},{text:"Period of acme",correct:true},{text:"Period of decline",correct:true}], explanation:"The microbe is transmissible during ALL stages of the disease, though the period of acme is typically the MOST contagious." },
      { lec:5, type:"mcq", text:"Incidence is always greater than prevalence in infectious disease.", options:[{text:"True",correct:false},{text:"False",correct:true}], explanation:"Prevalence (old + new cases) is always greater than incidence (only new cases)." },
      { lec:5, type:"mcq", text:"This epi curve for SARS shows: (Graph shows sequential growing humps starting from an index case)", options:[{text:"A continuous source of infection.",correct:false},{text:"A disseminated outbreak with propagated spread",correct:true},{text:"Outbreaks originating from an intermittent source.",correct:false},{text:"None of the above",correct:false}], explanation:"The SARS epi curve demonstrates a disseminated (propagated) outbreak passing from person to person." },
      { lec:5, type:"sata", text:"Which of the following descriptions applies to measles? (SATA)", options:[{text:"chronic",correct:false},{text:"acute",correct:true},{text:"contagious",correct:true},{text:"bacterial",correct:false}], explanation:"Measles is an acute and highly contagious viral infection (not bacterial or chronic)." },
      { lec:5, type:"mcq", text:"According to the test review, which specific normal flora are primarily found in the large and small intestine?", options:[{text:"Staphylococcus and Streptococcus",correct:false},{text:"E. coli and Enterobacter",correct:true},{text:"Corynebacteria and Spirochetes",correct:false},{text:"Lactobacilli and Staphylococcus",correct:false}], explanation:"E. coli and Enterobacter are the primary normal flora of the large and small intestine." },
      { lec:5, type:"mcq", text:"Which specific normal flora are commonly found in the nose and upper respiratory tract?", options:[{text:"E. coli and Enterobacter",correct:false},{text:"Staph, Strep, and Corynebacteria",correct:true},{text:"Lactobacilli",correct:false},{text:"Spirochetes",correct:false}], explanation:"Staphylococcus, Streptococcus, and Corynebacteria are normal flora of the nose and upper respiratory tract." },
      { lec:5, type:"mcq", text:"What is the approximate ratio of microbial cells to human cells in a healthy human body?", options:[{text:"At least 10 microbial cells for every human cell",correct:false},{text:"At least 1 microbial cell for every human cell",correct:true},{text:"1 microbial cell for every 10 human cells",correct:false},{text:"Microbial cells make up less than 1% of the body's cell count",correct:false}], explanation:"There is at least 1 microbial cell for every human cell in a healthy body (approx 40 trillion microbes to 30 trillion human cells)." },
      { lec:5, type:"mcq", text:"According to the test review, a bat infected with rabies that bites a human is an example of what type of transmission?", options:[{text:"Indirect transmission via biological vector",correct:false},{text:"Indirect transmission via fomite",correct:false},{text:"Direct transmission",correct:true},{text:"Airborne transmission",correct:false}], explanation:"Animal bites (like a rabid bat biting a human) are considered Direct Transmission because it is direct host-to-host contact, and the bat itself is infected and dying from the disease." },
      { lec:5, type:"mcq", text:"Which epidemiological measurement specifically provides an estimate of the risk of acquiring an infection during a given time period?", options:[{text:"Prevalence",correct:false},{text:"Incidence",correct:true},{text:"Mortality rate",correct:false},{text:"Morbidity rate",correct:false}], explanation:"Incidence measures NEW cases in a given time, providing an estimate of the risk of acquiring the infection." },
      { lec:5, type:"mcq", text:"How do you easily distinguish a disseminated outbreak from an intermittent outbreak on an epi curve?", options:[{text:"Intermittent outbreaks have a single sharp peak, while disseminated outbreaks are completely flat.",correct:false},{text:"Disseminated outbreaks consistently return to zero cases between spikes, whereas intermittent outbreaks do not.",correct:false},{text:"Intermittent outbreaks consistently return to zero cases between spikes, whereas disseminated outbreaks do not.",correct:true},{text:"There is no visual difference between the two curves.",correct:false}], explanation:"An intermittent outbreak curve will consistently return to zero cases between exposure events, while a disseminated (person-to-person) outbreak does not." },
      { lec:5, type:"mcq", text:"Considering nosocomial infections, is it possible to bring the hospital-acquired infection rate down to absolute zero?", options:[{text:"Yes, with strict handwashing protocols.",correct:false},{text:"Yes, by using prophylactic antibiotics on all patients.",correct:false},{text:"No, the rate will never be at 0 due to compromised patients and the constant presence of microbes.",correct:true},{text:"No, because handwashing is completely ineffective.",correct:false}], explanation:"The test review notes emphasize that nosocomial infections will 'never be at 0' because hospitals inherently concentrate sick, immunocompromised people and microbes." },
      { lec:5, type:"mcq", text:"Which of the following bacterial enzymes degrades blood clots?", options:[{text:"Hemolysin",correct:false},{text:"Hyaluronidase",correct:false},{text:"Coagulase",correct:false},{text:"Streptokinase",correct:true}], explanation:"Streptokinase is an enzyme that degrades/dissolves blood clots." },

      // LECTURE 6: Control of Microbes
      { lec:6, type:"mcq", text:"A chemical used on living tissue to destroy pathogens is called a(n):", options:[{text:"Disinfectant",correct:false},{text:"Antiseptic",correct:true},{text:"Sterilant",correct:false},{text:"Sanitizer",correct:false}], explanation:"Antiseptics go on living tissue; disinfectants go on inanimate objects." },
      { lec:6, type:"mcq", text:"Conditions that are free of contaminating microbes are described as:", options:[{text:"Septic",correct:false},{text:"Sanitized",correct:false},{text:"Aseptic",correct:true},{text:"Degermed",correct:false}], explanation:"Aseptic means free of contaminating microbes; septic means already contaminated." },
      { lec:6, type:"sata", text:"Which statements about sterilization are true? (SATA)", options:[{text:"It destroys or removes all forms of life",correct:true},{text:"There is an in-between 'partly sterile' state",correct:false},{text:"Prions are easily sterilized",correct:false},{text:"It includes destroying bacterial spores",correct:true},{text:"Bacterial spores are the most resistant microbe it kills",correct:true}], explanation:"Sterilization is all-or-nothing, includes destroying spores, and spores are the most resistant microbes it kills. Prions cannot be easily sterilized." },
      { lec:6, type:"mcq", text:"A bacteriostatic agent:", options:[{text:"Slows or stops bacterial growth without killing",correct:true},{text:"Kills all bacteria on contact",correct:false},{text:"Removes microbes from a surface",correct:false},{text:"Destroys all bacterial spores",correct:false}], explanation:"'-static' means slow growth, so growth can return once the agent is removed." },
      { lec:6, type:"mcq", text:"Which microbe is the most resistant to antimicrobial agents?", options:[{text:"Bacterial endospores",correct:false},{text:"Mycobacteria",correct:false},{text:"Fungal spores",correct:false},{text:"Prions",correct:true}], explanation:"Prions sit at the very top (most resistant) of the susceptibility ladder." },
      { lec:6, type:"mcq", text:"Which of the following is the most susceptible to chemical control?", options:[{text:"Prions",correct:false},{text:"Bacterial endospores",correct:false},{text:"Gram-negative bacteria",correct:false},{text:"Enveloped viruses",correct:true}], explanation:"Enveloped viruses are the easiest to kill and sit at the bottom (most susceptible) of the ladder." },
      { lec:6, type:"mcq", text:"Gram-negative bacteria are more resistant to chemicals than Gram-positive bacteria. The structure noted in the lecture is the:", options:[{text:"Waxy cell wall",correct:false},{text:"Periplasmic space",correct:true},{text:"Viral envelope",correct:false},{text:"Dormant cyst wall",correct:false}], explanation:"The periplasmic space is the feature linked to Gram-negative resistance to chemicals." },
      { lec:6, type:"sata", text:"Which factors affect how well an antimicrobial measure works? (SATA)", options:[{text:"Intensity or concentration of the measure",correct:true},{text:"Whether the measure is physical or chemotherapeutic",correct:false},{text:"Time of exposure",correct:true},{text:"Environmental factors such as organic matter",correct:true},{text:"The microbial population",correct:true}], explanation:"The five factors are population, environment (organic matter), time, intensity/concentration, and microbial characteristics." },
      { lec:6, type:"mcq", text:"If 1,000,000 bacteria die at a constant 90% per minute, how many survive after 3 minutes?", options:[{text:"1,000",correct:true},{text:"10,000",correct:false},{text:"100",correct:false},{text:"100,000",correct:false}], explanation:"1,000,000 -> 100,000 (1m) -> 10,000 (2m) -> 1,000 (3m)." },
      { lec:6, type:"mcq", text:"Ranking microbes from most to least susceptible, which one is third?", options:[{text:"Fungi",correct:false},{text:"Gram-negative bacteria",correct:false},{text:"Nonenveloped viruses",correct:true},{text:"Mycobacteria",correct:false}], explanation:"Order: Enveloped viruses (1), Gram-positive bacteria (2), Nonenveloped viruses (3)." },
      { lec:6, type:"mcq", text:"Thermal death time (TDT) is the:", options:[{text:"Temperature needed to kill a population in a given time",correct:false},{text:"Time needed for bacteria to double",correct:false},{text:"Lowest temperature at which microbes grow",correct:false},{text:"Time needed to kill a population of microbes at a given temperature",correct:true}], explanation:"TDT = time at a set temperature; TDP = temp for a set time." },
      { lec:6, type:"mcq", text:"Which condition sterilizes in an autoclave?", options:[{text:"100°C for 10 minutes",correct:false},{text:"121°C for 15 minutes",correct:true},{text:"160°C for 2 hours",correct:false},{text:"71.6°C for 15 seconds",correct:false}], explanation:"Autoclaving uses pressurized steam at 121°C for 15 minutes at 15 psi above atmospheric." },
      { lec:6, type:"sata", text:"Heat kills microbes by: (SATA)", options:[{text:"Inhibiting protein synthesis",correct:false},{text:"Destroying membranes",correct:true},{text:"Denaturing and oxidizing proteins",correct:true},{text:"Dehydration",correct:true},{text:"Breaking down cell walls only",correct:false}], explanation:"Heat destroys membranes, denatures/oxidizes proteins, and dehydrates the cells." },
      { lec:6, type:"mcq", text:"Which pasteurization method is the most common?", options:[{text:"71.6°C for 15 seconds (Flash)",correct:true},{text:"62.9°C for 30 minutes",correct:false},{text:"82°C for 3 seconds",correct:false},{text:"100°C for 10 minutes",correct:false}], explanation:"Flash pasteurization (71.6°C for 15 s) is the most common." },
      { lec:6, type:"sata", text:"Which statements about boiling water are true? (SATA)", options:[{text:"Bacterial spores are killed in 10 minutes",correct:false},{text:"It is not effective at sterilizing",correct:true},{text:"Most species are killed in 10 minutes",correct:true},{text:"Fungal spores and hepatitis A may need 30 minutes",correct:true},{text:"Bacterial spores need more than 2 hours",correct:true}], explanation:"Boiling kills most species fast but cannot reliably kill spores (needs >2 hours), so it is not effective for sterilization." },
      { lec:6, type:"mcq", text:"The '95' in N95 means the mask filters at least 95% of airborne particles down to:", options:[{text:"0.03 microns",correct:false},{text:"3 microns",correct:false},{text:"0.3 microns",correct:true},{text:"30 microns",correct:false}], explanation:"95 = at least 95% of particles down to 0.3 microns (300 nm)." },
      { lec:6, type:"mcq", text:"Which type of radiation can sterilize only surfaces because of poor penetration?", options:[{text:"Gamma rays",correct:false},{text:"X-rays",correct:false},{text:"Ionizing radiation",correct:false},{text:"Ultraviolet (UV) light",correct:true}], explanation:"UV is non-ionizing and has poor penetration, making it useful only for surfaces." },
      { lec:6, type:"mcq", text:"Filtration is best used for:", options:[{text:"Heat-sensitive materials such as antiserums and antibiotics",correct:true},{text:"Sterilizing bedding and utensils",correct:false},{text:"Destroying genetic material",correct:false},{text:"Disposing of contaminated gowns",correct:false}], explanation:"Filtration physically removes microbes without heat, ideal for heat-sensitive liquids." },
      { lec:6, type:"sata", text:"Which statements about ionizing radiation are true? (SATA)", options:[{text:"It includes gamma rays and x-rays",correct:true},{text:"It sterilizes surfaces only",correct:false},{text:"It has good penetration",correct:true},{text:"It is germicidal by destroying genetic material",correct:true},{text:"It is used to sterilize vaccines and sutures",correct:true}], explanation:"Ionizing radiation (gamma/x-rays) penetrates deeply, destroying genetic material, and is used to sterilize foods, vaccines, and sutures." },
      { lec:6, type:"sata", text:"Which preservation methods are bacteriostatic? (SATA)", options:[{text:"Salting",correct:true},{text:"Autoclaving",correct:false},{text:"Drying",correct:true},{text:"Refrigeration",correct:true},{text:"Freezing",correct:true}], explanation:"Salting, drying, and cold (refrigeration/freezing) slow or stop growth (bacteriostatic). Autoclaving kills (cidal)." },
      { lec:6, type:"mcq", text:"In the disk diffusion test, the test is:", options:[{text:"Quantitative and bactericidal",correct:false},{text:"Not quantitative and not bactericidal",correct:true},{text:"Quantitative but not bactericidal",correct:false},{text:"Bactericidal but not quantitative",correct:false}], explanation:"Disk diffusion is only a qualitative, visual test showing a clear zone; it doesn't give a concentration or confirm cell death." },
      { lec:6, type:"mcq", text:"In the disk diffusion test, a larger clear zone around the disk means the chemical is:", options:[{text:"Less effective",correct:false},{text:"More toxic to humans",correct:false},{text:"Better at killing microbes",correct:true},{text:"Quantitative",correct:false}], explanation:"A bigger clear zone shows a stronger effect on preventing bacterial growth." },
      { lec:6, type:"sata", text:"Which of the following are true regarding the use-dilution test? (SATA)", options:[{text:"It uses metal spheres in a 96-well plate.",correct:true},{text:"It is a qualitative test.",correct:false},{text:"It is quantitative.",correct:true},{text:"It is bactericidal.",correct:true}], explanation:"The use-dilution test is quantitative and bactericidal, using metal spheres." },
      { lec:6, type:"mcq", text:"Bleach has a phenol coefficient of 5.0 against S. aureus. This means it is:", options:[{text:"5 times worse than phenol",correct:false},{text:"The same as phenol",correct:false},{text:"5 times better than phenol",correct:true},{text:"Half as effective as phenol",correct:false}], explanation:"A phenol coefficient above 1 means it is better than phenol (5.0 = 5 times better)." },
      { lec:6, type:"sata", text:"Which are drawbacks of the disk diffusion and use-dilution tests? (SATA)", options:[{text:"They use controlled conditions with no organic matter",correct:true},{text:"They do not test toxicity of the chemical",correct:true},{text:"They have no temperature or pH variation",correct:true},{text:"They only work on viruses",correct:false},{text:"They always need an automated plate reader",correct:false}], explanation:"Both tests use ideal lab conditions (no organic matter, set pH/temp) and ignore human toxicity." },
      { lec:6, type:"mcq", text:"Phenol is mainly effective against:", options:[{text:"Gram-positive bacteria",correct:true},{text:"Gram-negative bacteria",correct:false},{text:"Bacterial spores",correct:false},{text:"All microbes equally",correct:false}], explanation:"Phenol works mostly on Gram-positive bacteria and is caustic to skin." },
      { lec:6, type:"mcq", text:"Which chemical kills by oxidizing proteins and poking holes in membranes?", options:[{text:"Iodine",correct:false},{text:"Formaldehyde",correct:false},{text:"Alcohol",correct:false},{text:"Chlorine (bleach)",correct:true}], explanation:"Chlorine (bleach) oxidizes proteins and pokes holes in membranes." },
      { lec:6, type:"mcq", text:"Which chemical is used to disinfect instruments and as a skin antiseptic but is toxic to skin?", options:[{text:"Copper",correct:false},{text:"Alcohol",correct:true},{text:"Ethylene oxide",correct:false},{text:"Formaldehyde",correct:false}], explanation:"Alcohol was noted in lecture as an instrument disinfectant and skin antiseptic that can be toxic/irritating to skin." },
      { lec:6, type:"sata", text:"What do phenol derivatives such as triclosan target? (SATA)", options:[{text:"Cell membranes",correct:true},{text:"Nucleic acids",correct:false},{text:"Proteins",correct:true},{text:"Spore coats",correct:false},{text:"Ribosomes",correct:false}], explanation:"Phenol derivatives denature proteins and disrupt cell membranes." },
      { lec:6, type:"sata", text:"Which chemicals fix (join) proteins and nucleic acids? (SATA)", options:[{text:"Alcohols",correct:false},{text:"Formaldehyde",correct:true},{text:"Hydrogen peroxide",correct:false},{text:"Glutaraldehyde",correct:true},{text:"Ethylene oxide",correct:true}], explanation:"Formaldehyde, glutaraldehyde, and ethylene oxide fix proteins and nucleic acids." },
      { lec:6, type:"sata", text:"Which statements about iodine are true? (SATA)", options:[{text:"It works by inactivating proteins",correct:true},{text:"It is better than chlorine against most microbes",correct:true},{text:"Tincture of iodine is iodine in water",correct:false},{text:"It stains, smells and is not stable",correct:true},{text:"Iodophors are iodine linked to detergents",correct:true}], explanation:"Iodine inactivates proteins, is better than chlorine, but stains and smells. Tincture of iodine is iodine in alcohol, not water. Iodophors use detergents." },
      { lec:6, type:"sata", text:"From the following list of bacterial extracellular enzymes, choose the one(s) that dissolve blood clots OR destroy white blood cells. (SATA)", options:[{text:"coagulase",correct:false},{text:"streptokinase",correct:true},{text:"hyaluronidase",correct:false},{text:"leukocidin",correct:true},{text:"hemolysin",correct:false}], explanation:"Streptokinase degrades/dissolves blood clots. Leukocidins destroy white blood cells." },
      { lec:6, type:"sata", text:"Which of the following is true about radiation to control microbes? (SATA)", options:[{text:"nonionizing radiation is mostly UV",correct:true},{text:"UV light is used in surgical rooms",correct:true},{text:"ionizing radiation is used to sterilize sutures",correct:true},{text:"foods can NOT be legally irradiated in Canada",correct:false}], explanation:"UV is non-ionizing and used in surgical rooms. Ionizing radiation sterilizes sutures. Several foods CAN be legally irradiated in Canada (e.g. potatoes, ground beef)." },
      { lec:6, type:"sata", text:"Which of the following can be used to sterilize? (SATA)", options:[{text:"hot air baking",correct:true},{text:"autoclaves",correct:true},{text:"lyophilization (freeze-drying)",correct:false},{text:"freezers",correct:false}], explanation:"Hot air baking (160°C for 2h) and autoclaves (121°C for 15m at 15psi) can sterilize. Freezing and lyophilization are bacteriostatic preservatives." },
      { lec:6, type:"mcq", text:"The '95' in N95 mask designation means it stops particles larger than 95 microns.", options:[{text:"True",correct:false},{text:"False",correct:true}], explanation:"The '95' means it filters at least 95% of airborne particles down to 0.3 microns (300 nm)." },
      { lec:6, type:"sata", text:"Which of the following is true for chemical disinfectants and antiseptics? (SATA)", options:[{text:"iodine is more effective than chlorine",correct:true},{text:"a phenol coefficient above one means the chemical is more effective than phenol",correct:true},{text:"enveloped viruses are easier to kill than Gram +ve bacteria",correct:true},{text:"chlorhexidine is a phenol derivative",correct:true}], explanation:"Iodine beats chlorine. PC > 1 is better than phenol. Enveloped viruses are the MOST susceptible (easiest to kill). Chlorhexidine is a common phenol derivative." },
      { lec:6, type:"mcq", text:"If you have 10,000 bacteria on a table, pour bleach on them, and 9,000 die in the first minute, how many bacteria will be left alive after the NEXT (second) minute?", options:[{text:"0",correct:false},{text:"10",correct:false},{text:"100",correct:true},{text:"1,000",correct:false}], explanation:"Bacteria die at a constant logarithmic rate (90% per minute). 10,000 total. Minute 1: 9,000 die, leaving 1,000. Minute 2: 90% of 1,000 die (900), leaving 100 survivors." },
      { lec:6, type:"mcq", text:"You need to sterilize a highly heat-sensitive dry powder. Why can't you use an autoclave, and what method should you use instead?", options:[{text:"Autoclaves use moist steam which ruins powder; hot air baking should be used instead.",correct:true},{text:"Autoclaves are not hot enough; incineration should be used instead.",correct:false},{text:"Autoclaves use radiation which degrades powder; filtration should be used instead.",correct:false},{text:"Autoclaves use dry heat which is too slow; boiling water should be used instead.",correct:false}], explanation:"You cannot sterilize dry powders with an autoclave because the moist steam will ruin it. Hot air baking is required." },
      { lec:6, type:"mcq", text:"What is the primary target and effective range of plain phenol?", options:[{text:"Targets cell wall synthesis; effective against Gram-negative bacteria",correct:false},{text:"Targets proteins; effective against Gram-positive bacteria",correct:true},{text:"Targets DNA synthesis; effective against all viruses",correct:false},{text:"Targets LPS; effective against all fungi",correct:false}], explanation:"Phenol denatures proteins and is primarily effective against Gram-positive bacteria." },

      // LECTURE 7: Antibiotics
      { lec:7, type:"mcq", text:"Which term describes a drug that harms the microbe but not the host?", options:[{text:"Selective toxicity",correct:true},{text:"Spectrum of activity",correct:false},{text:"Bactericidal action",correct:false},{text:"Chemotherapeutic agent",correct:false}], explanation:"Selective toxicity means the drug harms the microbe without harming the host; it is the core goal of antibiotics." },
      { lec:7, type:"sata", text:"Which statements about antibiotics are TRUE? (SATA)", options:[{text:"An antibiotic inhibits or kills microorganisms, and viruses are excluded.",correct:true},{text:"Antibiotics are always made in a laboratory and never come from microbes.",correct:false},{text:"An antibiotic is used therapeutically.",correct:true},{text:"A small amount of antibiotic can be effective because it is highly specific.",correct:true}], explanation:"Antibiotics exclude viruses, are used therapeutically, and work in small amounts. Most still come from microbes (like fungi and bacteria)." },
      { lec:7, type:"mcq", text:"Erythromycin is best described as:", options:[{text:"Broad spectrum, killing both Gram-positive and Gram-negative bacteria",correct:false},{text:"Narrow spectrum, effective against Gram-positive bacteria only",correct:true},{text:"Effective only against viruses",correct:false},{text:"Effective only against fungi",correct:false}], explanation:"Erythromycin is a narrow-spectrum antibiotic that targets Gram-positive bacteria." },
      { lec:7, type:"mcq", text:"Why are broad-spectrum antibiotics not used all the time?", options:[{text:"They are always less toxic than narrow-spectrum drugs.",correct:false},{text:"They cannot kill any bacteria at all.",correct:false},{text:"They can kill good bacteria such as normal flora and raise the chance of resistance.",correct:true},{text:"They only work in very large amounts.",correct:false}], explanation:"Broad-spectrum drugs affect a wide range of bacteria, including protective normal flora, and increase the likelihood of developing resistance." },
      { lec:7, type:"mcq", text:"Which drug is correctly matched with its natural source?", options:[{text:"Quinine: Penicillium fungus",correct:false},{text:"Penicillin: cinchona tree bark",correct:false},{text:"Aspirin: Streptomyces bacteria",correct:false},{text:"Streptokinase: Streptococcus bacteria",correct:true}], explanation:"Streptokinase is derived from Streptococcus bacteria. Quinine is from the cinchona tree, Penicillin from Penicillium fungus, and Aspirin from the willow tree." },
      { lec:7, type:"mcq", text:"When is chemotherapy used to kill microbes?", options:[{text:"When the immune system fails and the infection is severe",correct:true},{text:"For every mild infection, to speed recovery",correct:false},{text:"Only to kill viruses",correct:false},{text:"Before the immune system has had any chance to respond",correct:false}], explanation:"Our immune system kills most microbes first; chemotherapy is reserved for when the immune system fails or the infection is severe." },
      { lec:7, type:"mcq", text:"Which order lists the four major antibiotic sources from most to least prevalent?", options:[{text:"Synthetic, Streptomyces bacteria, Penicillium fungus, Gram-positive bacilli",correct:false},{text:"Streptomyces bacteria, synthetic, Gram-positive bacilli, Penicillium fungus",correct:true},{text:"Penicillium fungus, Gram-positive bacilli, synthetic, Streptomyces bacteria",correct:false},{text:"Gram-positive bacilli, Streptomyces bacteria, Penicillium fungus, synthetic",correct:false}], explanation:"The notes rank Streptomyces first, synthetic second, Gram-positive bacilli third, and Penicillium fourth." },
      { lec:7, type:"mcq", text:"Which of the following is the 4th most common source of antibiotics?", options:[{text:"Gram +ve bacilli",correct:false},{text:"Synthetic",correct:false},{text:"Escherichia coli",correct:false},{text:"Streptomyces bacteria",correct:false},{text:"Penicillium fungus",correct:true}], explanation:"Penicillium fungus is the 4th major source of antibiotics." },
      { lec:7, type:"sata", text:"Which are listed methods of antimicrobial activity? (SATA)", options:[{text:"Inhibition of protein synthesis",correct:true},{text:"Injury to plasma membrane",correct:true},{text:"Inhibition of oxygen uptake",correct:false},{text:"Inhibition of essential metabolite synthesis",correct:true}], explanation:"Methods include inhibiting protein synthesis, cell wall synthesis, nucleic acid synthesis, essential metabolites, and injuring the plasma membrane. Oxygen uptake is not on the list." },
      { lec:7, type:"mcq", text:"Penicillin acts mainly by which method?", options:[{text:"Injury to plasma membrane",correct:false},{text:"Inhibition of protein synthesis",correct:false},{text:"Inhibition of cell wall synthesis",correct:true},{text:"Inhibition of nucleic acid synthesis",correct:false}], explanation:"Penicillin blocks peptidoglycan cross-linking, inhibiting cell wall synthesis." },
      { lec:7, type:"mcq", text:"Why can a drug that blocks folic acid harm bacteria without harming humans?", options:[{text:"Humans make folic acid inside ribosomes.",correct:false},{text:"Bacteria cannot absorb folic acid from their surroundings.",correct:false},{text:"Humans cannot absorb folic acid at all.",correct:false},{text:"Bacteria synthesize folic acid, while humans consume it from food.",correct:true}], explanation:"Bacteria must synthesize their own folic acid to survive, while humans obtain it from their diet." },
      { lec:7, type:"sata", text:"Which of the following is/are true for the antibiotics known as sulfonamides? (SATA)", options:[{text:"They inhibit folic acid synthesis",correct:true},{text:"They are synthetic agents",correct:true},{text:"They inhibit cell wall synthesis",correct:false},{text:"They only work against Gram +ve bacteria",correct:false}], explanation:"Sulfonamides are synthetic agents that competitively inhibit folic acid synthesis. They are broad-spectrum, not just Gram +ve." },
      { lec:7, type:"mcq", text:"Isoniazid is called a 'Trojan horse' because:", options:[{text:"It is toxic as soon as it is swallowed.",correct:false},{text:"It is not activated until it gets into the body, where bacterial catalase turns it into its toxic form.",correct:true},{text:"It binds sterols in fungal membranes.",correct:false},{text:"It is extracted from willow tree bark.",correct:false}], explanation:"Isoniazid (INH) remains inactive until bacterial catalase converts it to a toxic form inside the bacteria." },
      { lec:7, type:"mcq", text:"How does TB reduce its susceptibility to isoniazid?", options:[{text:"It makes more catalase, so INH is activated faster.",correct:false},{text:"It produces penicillinase to break INH.",correct:false},{text:"It lowers catalase and raises hydroperoxidase, so less INH is activated.",correct:true},{text:"It stops making folic acid.",correct:false}], explanation:"TB resists INH by downregulating catalase and upregulating hydroperoxidase, preventing the activation of the drug." },
      { lec:7, type:"mcq", text:"Fluoroquinolones such as ciprofloxacin work by inhibiting:", options:[{text:"Cell wall synthesis",correct:false},{text:"Folic acid synthesis",correct:false},{text:"Sterol synthesis",correct:false},{text:"DNA synthesis",correct:true}], explanation:"Fluoroquinolones end in '-oxacin' and inhibit bacterial DNA synthesis." },
      { lec:7, type:"mcq", text:"What is the critical structure of penicillin?", options:[{text:"Beta-lactam ring",correct:true},{text:"Peptidoglycan ring",correct:false},{text:"Sterol ring",correct:false},{text:"Folic acid ring",correct:false}], explanation:"The beta-lactam ring is the active nucleus and critical structure of all penicillins." },
      { lec:7, type:"sata", text:"Which are advantages of penicillin derivatives? (SATA)", options:[{text:"Increased bioavailability",correct:true},{text:"Stomach acid resistance",correct:true},{text:"Less effective (decreased spectrum)",correct:false},{text:"Greater half-lives (lasts longer)",correct:true}], explanation:"Increased bioavailability, stomach acid resistance, and greater half-lives are advantages. Decreased effectiveness is a disadvantage." },
      { lec:7, type:"mcq", text:"Penicillinase causes penicillin resistance by:", options:[{text:"Blocking the ribosome",correct:false},{text:"Breaking the C-N bond in the beta-lactam ring",correct:true},{text:"Producing folic acid",correct:false},{text:"Destroying the outer membrane",correct:false}], explanation:"Penicillinase (beta-lactamase) cuts the C-N bond in the beta-lactam ring, rendering penicillin inactive against the cell wall." },
      { lec:7, type:"mcq", text:"Why are cephalosporins used as a substitute for penicillin?", options:[{text:"They are never affected by penicillinase.",correct:false},{text:"They are made from Penicillium mold.",correct:false},{text:"They have a narrower spectrum.",correct:false},{text:"They help with penicillin allergy and give some penicillinase resistance.",correct:true}], explanation:"Cephalosporins are modified beta-lactams that substitute for penicillin in allergic patients and offer some resistance to penicillinase." },
      { lec:7, type:"mcq", text:"Which side effect is linked to tetracycline in children?", options:[{text:"Stunted bone growth",correct:true},{text:"Aplastic anemia",correct:false},{text:"Gray syndrome",correct:false},{text:"Numbness in the extremities",correct:false}], explanation:"Tetracycline can stunt bone growth and discolor teeth in children." },
      { lec:7, type:"mcq", text:"Why does chloramphenicol cause aplastic anemia?", options:[{text:"It binds LPS in the outer membrane.",correct:false},{text:"It stops red blood cells being made, so the RBC count drops.",correct:true},{text:"It blocks folic acid synthesis.",correct:false},{text:"It breaks the beta-lactam ring.",correct:false}], explanation:"Chloramphenicol suppresses bone marrow, stopping red blood cell production, causing aplastic anemia." },
      { lec:7, type:"mcq", text:"From the following, choose the antibiotic that was isolated from Streptomyces bacteria, inhibits protein synthesis, and is not well absorbed so often used against intestinal infections.", options:[{text:"Chloramphenicol",correct:false},{text:"Streptomycin",correct:true},{text:"Cephalosporin",correct:false},{text:"Ampicillin",correct:false}], explanation:"Streptomycin binds ribosomes, inhibiting protein synthesis, and stays in the GI tract as it is not well absorbed." },
      { lec:7, type:"sata", text:"Which statements about the E-test are TRUE? (SATA)", options:[{text:"It uses a plastic strip coated with a gradient of antibiotic.",correct:true},{text:"The MIC is read where the bacteria touch the strip.",correct:true},{text:"It shows that bacteria are dead, not just not growing.",correct:false},{text:"It is a purely qualitative test.",correct:false}], explanation:"The E-test uses a gradient strip to find the MIC (quantitative), but it does not confirm cell death (bactericidal activity)." },
      { lec:7, type:"mcq", text:"What does the Kirby-Bauer (disk diffusion) test measure?", options:[{text:"An exact MIC number",correct:false},{text:"Whether bacteria are dead",correct:false},{text:"A qualitative clear zone of inhibition",correct:true},{text:"The antibiotic concentration in the disc",correct:false}], explanation:"Kirby-Bauer provides a qualitative clear zone width, not a precise concentration (MIC) or proof of death." },
      { lec:7, type:"mcq", text:"In a broth dilution test, what is the MIC?", options:[{text:"The highest concentration where growth is seen",correct:false},{text:"The width of the clear zone",correct:false},{text:"The colour of the plastic strip",correct:false},{text:"The lowest concentration with no visible bacterial growth",correct:true}], explanation:"The Minimum Inhibitory Concentration (MIC) is the lowest concentration tube that remains clear (no visible growth)." },
      { lec:7, type:"mcq", text:"How can broth dilution show whether an antibiotic is bactericidal?", options:[{text:"Put a sample from the lowest no-growth concentration into a petri dish and see whether bacteria grow.",correct:true},{text:"Read the MIC from a plastic strip.",correct:false},{text:"Measure the clear zone around a paper disc.",correct:false},{text:"Count the number of tubes that are cloudy.",correct:false}], explanation:"By sub-culturing the clear tube into fresh media without antibiotics, you can see if the bacteria were actually killed or just paused." },
      { lec:7, type:"mcq", text:"How does nystatin act on fungi?", options:[{text:"It blocks ribosomes.",correct:false},{text:"It binds sterols in the fungal membrane and changes its permeability.",correct:true},{text:"It inhibits folic acid synthesis.",correct:false},{text:"It breaks down the cell wall peptidoglycan.",correct:false}], explanation:"Nystatin targets existing sterols in the fungal membrane, making it leaky." },
      { lec:7, type:"sata", text:"Which statements about imidazoles and triazoles are TRUE? (SATA)", options:[{text:"Imidazoles inhibit sterol synthesis.",correct:true},{text:"Imidazoles are natural products.",correct:false},{text:"Triazoles are more potent than imidazoles.",correct:true},{text:"Triazoles need a higher dose than imidazoles.",correct:false}], explanation:"Imidazoles and triazoles inhibit sterol synthesis. They are synthetic, and triazoles are more potent (require lower doses)." },
      { lec:7, type:"mcq", text:"Which of the following is an antifungal agent that works by inhibiting sterol synthesis (similar to Clotrimazole), but is more potent than Clotrimazole, and therefore requires a lower dose with fewer side effects?", options:[{text:"Mycostatin",correct:false},{text:"Amphotericin B",correct:false},{text:"Methicillin",correct:false},{text:"Fluconazole",correct:true}], explanation:"Fluconazole is a triazole, which is more potent than the imidazole Clotrimazole, requiring a lower dose." },
      { lec:7, type:"mcq", text:"Amphotericin B is used for:", options:[{text:"Candida skin infections",correct:false},{text:"Malaria",correct:false},{text:"Serious fungal infections",correct:true},{text:"Tapeworm infections",correct:false}], explanation:"Amphotericin B binds sterols and is reserved for serious fungal infections due to significant side effects." },
      { lec:7, type:"mcq", text:"Nystatin is often combined with broad-spectrum antibiotics to prevent overgrowth of:", options:[{text:"Streptococcus",correct:false},{text:"Penicillium",correct:false},{text:"Plasmodium",correct:false},{text:"Candida",correct:true}], explanation:"Nystatin prevents the overgrowth of Candida albicans yeast when normal flora bacteria are wiped out by broad-spectrum antibiotics." },
      { lec:7, type:"mcq", text:"Which of the following is a quantitative test that can be used to assess if the chemical agent is bactericidal?", options:[{text:"disk diffusion",correct:false},{text:"use-dilution",correct:true}], explanation:"The use-dilution test is quantitative and can check if an agent is bactericidal. Disk diffusion (Kirby-Bauer) is qualitative." },
      { lec:7, type:"mcq", text:"Most antibiotics originate from microbes.", options:[{text:"True",correct:true},{text:"False",correct:false}], explanation:"Yes, most antibiotics originate naturally from microbes fighting each other (e.g. Streptomyces)." },
      { lec:7, type:"sata", text:"Which of the following apply to penicillin? (SATA)", options:[{text:"it was discovered by accident",correct:true},{text:"it inhibits carbohydrate synthesis",correct:false},{text:"Cephalexin is a derivative",correct:false},{text:"Methicillin is a derivative",correct:true},{text:"the critical structure is an aminoglycoside",correct:false}], explanation:"Discovered by accident. Methicillin is a derivative. It inhibits CELL WALL (peptidoglycan) synthesis, not carbohydrates. Cephalexin is a cephalosporin. The critical structure is the beta-lactam ring, not aminoglycoside." },
      { lec:7, type:"sata", text:"Which of the following apply to the broth dilution test for antibiotics? (SATA)", options:[{text:"it determines a MIC",correct:true},{text:"it uses discs of filter paper",correct:false},{text:"it also tests the effectiveness of disinfectants",correct:false},{text:"it is easily adapted to check if the antibiotic is bactericidal",correct:true}], explanation:"Broth dilution determines the MIC and can easily check if the drug is bactericidal by sub-culturing. Filter paper discs are used in Kirby-Bauer." },
      { lec:7, type:"mcq", text:"Which of the following antimicrobial agents specifically targets the lipopolysaccharide (LPS) layer of Gram-negative bacteria?", options:[{text:"Penicillin",correct:false},{text:"Polymyxins",correct:true},{text:"Tetracycline",correct:false},{text:"Isoniazid",correct:false}], explanation:"Polymyxins bind to LPS in the outer membrane of Gram-negative bacteria, disrupting it." },
      { lec:7, type:"mcq", text:"How does isoniazid help to kill TB bacteria?", options:[{text:"Inhibition of protein synthesis",correct:false},{text:"Inhibition of cell membrane synthesis",correct:false},{text:"Breaking holes in the cell membrane",correct:false},{text:"Inhibition of mycolic acid synthesis",correct:true}], explanation:"Isoniazid is activated by catalase and inhibits mycolic acid synthesis, which is essential for the mycobacterial cell wall." },
      { lec:7, type:"sata", text:"Which of the following are true about triazoles? (SATA)", options:[{text:"They are antifungals",correct:true},{text:"They inhibit sterol synthesis",correct:true},{text:"They are more potent than imidazoles",correct:true},{text:"Compared with imidazoles, a lower dose is required",correct:true},{text:"They are natural products derived from Streptomyces",correct:false}], explanation:"Triazoles are synthetic antifungals that inhibit sterol synthesis. They are more potent than imidazoles, requiring a lower dose with fewer side effects." },

      // LECTURE 8: Antivirals & Superbugs
      { lec:8, type:"mcq", text:"Why do antibiotics generally fail against viral infections?", options:[{text:"Viruses have thick membranes that block antibiotics.",correct:false},{text:"Viruses do not grow or metabolize like cells, so antibiotics have no normal process to block.",correct:true},{text:"Viruses have strong cell walls that resist antibiotics.",correct:false},{text:"Antibiotics are too weak to affect any microbe.",correct:false}], explanation:"Viruses lack the cellular metabolism, cell walls, and structures that antibiotics normally target." },
      { lec:8, type:"sata", text:"Which statements about antiviral drugs are correct? (SATA)", options:[{text:"Most antiviral drugs are synthetic, meaning human made.",correct:true},{text:"Many inhibit viral attachment, gene replication or viral enzymes.",correct:true},{text:"They mainly target the bacterial cell wall.",correct:false},{text:"They work by the same targets as antibiotics.",correct:false}], explanation:"Most antivirals are synthetic and target specific viral steps (attachment, replication, enzymes). They do NOT target cell walls." },
      { lec:8, type:"mcq", text:"A drug acts as a fake building block that stops viral genetic material from being copied. Which mode of action is this?", options:[{text:"Inhibit attachment",correct:false},{text:"Disrupt genomic replication (nukes)",correct:true},{text:"Inhibit viral enzymes (non-nukes)",correct:false},{text:"Interferons",correct:false}], explanation:"'Nukes' (nucleoside/nucleotide analogs) act as fake building blocks, stopping genetic replication." },
      { lec:8, type:"mcq", text:"Which antiviral group is the only natural option?", options:[{text:"Nukes",correct:false},{text:"Non-nukes",correct:false},{text:"Interferons",correct:true},{text:"Attachment blockers",correct:false}], explanation:"Interferons are the only natural antiviral medications, produced by human cells." },
      { lec:8, type:"mcq", text:"Compared with antibiotics, how do most antiviral drugs differ?", options:[{text:"They target the bacterial cell wall.",correct:false},{text:"They target bacterial protein synthesis.",correct:false},{text:"They are always made from natural sources.",correct:false},{text:"They are mostly synthetic and do not target the cell wall.",correct:true}], explanation:"Antivirals are predominantly synthetic and bypass the cell wall, targeting viral attachment or replication instead." },
