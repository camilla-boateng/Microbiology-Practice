<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MICR1500 Clinical Microbiology Practice Exam</title>
  <style>
:root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct-border: #16a34a;
            --correct-bg: #f0fdf4;
            --correct-text: #15803d;
            --wrong-border: #dc2626;
            --wrong-bg: #fef2f2;
            --wrong-text: #b91c1c;
            --partial-border: #d97706;
            --partial-bg: #fffbeb;
            --partial-text: #92400e;
            --border-color: #e2e8f0;
            --selected-border: #93c5fd;
            --selected-bg: #eff6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* Sticky Header */
        header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            padding: 12px 16px;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-title {
            min-width: 0;
        }

        .header-title h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-title p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .score-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Navigation / Filter Bar */
        .nav-bar {
            max-width: 800px;
            margin: 16px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-bar::-webkit-scrollbar { display: none; }

        .filter-btn,
        .reset-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .filter-btn:hover,
        .reset-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* Main Container */
        main {
            max-width: 800px;
            margin: 16px auto;
            padding: 0 16px;
        }

        /* Question Cards */
        .q-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .q-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .q-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .q-cat {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .q-text {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.45;
        }

        /* Options */
        .opt-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opt-btn {
            display: flex;
            align-items: flex-start;
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .opt-btn:active:not(:disabled) { background-color: #f1f5f9; }

        .opt-prefix {
            font-weight: 700;
            margin-right: 8px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .opt-btn.selected {
            border-color: var(--selected-border);
            background: var(--selected-bg);
            color: #1d4ed8;
        }

        .q-card.answered .opt-btn {
            cursor: default;
            pointer-events: none;
            opacity: 0.6;
        }

        .q-card.answered .opt-btn.user-correct,
        .q-card.answered .opt-btn.reveal-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        .q-card.answered .opt-btn.user-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            opacity: 1 !important;
            font-weight: 600;
        }

        /* PATH2200 Submit */
        .submit-q-btn {
            margin-top: 14px;
            padding: 9px 14px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }

        .submit-q-btn:hover:not(:disabled) { opacity: 0.92; }
        .submit-q-btn:active:not(:disabled) { transform: scale(0.98); }
        .submit-q-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .feedback-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .feedback-box.correct {
            background-color: var(--correct-bg);
            border-left: 4px solid var(--correct-border);
            color: var(--correct-text);
        }

        .feedback-box.incorrect {
            background-color: var(--wrong-bg);
            border-left: 4px solid var(--wrong-border);
            color: var(--wrong-text);
        }

        .feedback-box.partial {
            background-color: var(--partial-bg);
            border-left: 4px solid var(--partial-border);
            color: var(--partial-text);
        }

        .feedback-title { font-weight: 700; margin-bottom: 4px; }
        .explanation { margin-top: 4px; color: inherit; }

        @media (max-width: 640px) {
            header { padding: 10px 12px; }
            .header-title h1 { font-size: 1rem; }
            .header-title p { font-size: 0.7rem; }
            .score-badge { padding: 5px 10px; font-size: 0.8rem; }
            .nav-bar { padding: 0 12px; margin-top: 12px; }
            main { margin-top: 12px; padding: 0 12px; }
            .q-card { padding: 16px; }
            .q-text { font-size: 0.95rem; }
            .opt-btn { font-size: 0.9rem; padding: 11px 12px; }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <div class="header-title">
                <h1>MICR1500 Clinical Microbiology Practice Exam</h1>
                <p id="header-subtitle">100 Questions • 4 Lecture Sections + Malaria Reading</p>
            </div>
            <div class="score-badge" id="score-counter">
                Grade: 0%
            </div>
        </div>
    </header>

    <div class="nav-bar" id="navTabs">
        <button class="filter-btn active" data-lec="all" type="button">All (100)</button>
        <button class="filter-btn" data-lec="1" type="button">Lec 1: Intro &amp; History (20)</button>
        <button class="filter-btn" data-lec="2" type="button">Lec 2: Bacteria &amp; Staining (20)</button>
        <button class="filter-btn" data-lec="3" type="button">Lec 3: Viruses &amp; Prions (20)</button>
        <button class="filter-btn" data-lec="4" type="button">Lec 4: Fungi &amp; Protozoa (20)</button>
        <button class="filter-btn" data-lec="5" type="button">Malaria Reading (20)</button>
        <button class="reset-btn" id="resetBtn" type="button">Reset</button>
    </div>

    <main id="questionsContainer"></main>

    <script>
    // QUESTION BANK DATA
    // ---------------------------------------------------------
    const questionBank = [

      // ==========================================
      // LECTURE 1: Introduction to Microbiology (20 Qs: 16 MCQ, 4 SATA)
      // ==========================================
      {
        lec: 1,
        type: "sata",
        text: "Which of the following entities are classified as acellular microbes lacking cellular structures? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Viruses", correct: true },
          { text: "Prions", correct: true },
          { text: "Bacteria", correct: false },
          { text: "Fungi", correct: false },
          { text: "Protozoa", correct: false }
        ],
        explanation: "Viruses and prions are acellular microbes characterized by the absence of a cell structure. Bacteria, fungi, and protozoa are cellular."
      },
      {
        lec: 1,
        type: "sata",
        text: "Which of the following statements accurately characterize nonpathogens and opportunists? (SELECT ALL THAT APPLY)",
        options: [
          { text: "A nonpathogen does not normally cause disease.", correct: true },
          { text: "Staphylococcus epidermidis is an example of a nonpathogen.", correct: true },
          { text: "Opportunists cause infection when they are in the wrong place, at the wrong time, or in the wrong amount.", correct: true },
          { text: "Pathogens never cause disease unless immunity is completely absent.", correct: false },
          { text: "Opportunists are strictly acellular entities.", correct: false }
        ],
        explanation: "Nonpathogens like S. epidermidis do not normally cause disease. When placed in unusual body locations or amounts, they act as opportunists."
      },
      {
        lec: 1,
        type: "sata",
        text: "Which historical figures are correctly matched with their specific contribution to microbiology? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Antonie van Leeuwenhoek – First person to draw a microbe / Father of Microbiology", correct: true },
          { text: "Ignaz Semmelweis – Advocated for physicians washing hands using chlorine", correct: true },
          { text: "Robert Koch – Proved the germ theory of disease using culture techniques", correct: true },
          { text: "Angelina Fanny Hesse – Suggested agar as a microbial growth medium", correct: true },
          { text: "Edward Jenner – Discovered penicillin mold antibiotics.", correct: false }
        ],
        explanation: "Leeuwenhoek (microbes), Semmelweis (chlorine handwashing), Koch (germ theory), and Hesse (agar) are correctly paired. Jenner performed the first smallpox vaccination."
      },
      {
        lec: 1,
        type: "sata",
        text: "Which statements regarding global disease burden, pandemics, and eradication are correct? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Smallpox is the only infectious human disease officially eradicated globally.", correct: true },
          { text: "Acute lower respiratory infections rank as the number one infectious killer worldwide.", correct: true },
          { text: "Wild-type polio virus is primarily transmitted via the fecal-oral route.", correct: true },
          { text: "Measles is the single most infectious disease in the world.", correct: true },
          { text: "SARS-CoV-2 is the first pandemic recorded in human history.", correct: false }
        ],
        explanation: "Smallpox is eradicated; lower respiratory infections are the top killer; wild polio spreads via fecal-oral transmission; measles is the most infectious. Numerous historical pandemics occurred prior to SARS-CoV-2."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Who is widely recognized as the 'Father of Microbiology' and was the first person to draw a microbe?",
        options: [
          { text: "Antonie van Leeuwenhoek", correct: true },
          { text: "Louis Pasteur", correct: false },
          { text: "Robert Koch", correct: false },
          { text: "Joseph Lister", correct: false }
        ],
        explanation: "Antonie van Leeuwenhoek is the Father of Microbiology and first drew microbes in the 1670s."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Which historical figure conducted the first epidemiological study by tracing a cholera outbreak to a specific water pump?",
        options: [
          { text: "John Snow", correct: true },
          { text: "Ignaz Semmelweis", correct: false },
          { text: "Edward Jenner", correct: false },
          { text: "Dmitri Ivanovsky", correct: false }
        ],
        explanation: "John Snow performed the first epidemiological study of infectious disease regarding cholera."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Joseph Lister is best remembered in microbiology history for which contribution?",
        options: [
          { text: "Introducing antiseptic surgery using carbolic acid (phenol)", correct: true },
          { text: "Discovering penicillin in mold cultures", correct: false },
          { text: "Developing the smallpox vaccine", correct: false },
          { text: "Proving the germ theory of disease", correct: false }
        ],
        explanation: "Joseph Lister is the Father of antiseptic surgery, utilizing carbolic acid to treat wounds and cleanse after surgery."
      },
      {
        lec: 1,
        type: "mcq",
        text: "What was the primary paradigm shift that characterized the 'Golden Age of Microbiology' (1857-1917)?",
        options: [
          { text: "Linking specific microbes to specific diseases (Germ Theory)", correct: true },
          { text: "The invention of the scanning electron microscope", correct: false },
          { text: "The complete eradication of polio globally", correct: false },
          { text: "The discovery of synthetic antiviral drugs", correct: false }
        ],
        explanation: "The Golden Age was defined by discovering disease causes and proving the germ theory."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Why must healthcare workers use physical hand washing with soap and water rather than alcohol-based hand sanitizer when caring for a patient with Clostridium difficile?",
        options: [
          { text: "C. difficile is spore-forming; hand sanitizer does not kill spores.", correct: true },
          { text: "C. difficile is an acellular virus unaffected by alcohol.", correct: false },
          { text: "Alcohol chemically neutralizes antibiotics in the patient's room.", correct: false },
          { text: "Hand sanitizer increases bacterial exotoxin production.", correct: false }
        ],
        explanation: "C. difficile is spore-forming; alcohol sanitizer does not kill spores, necessitating physical hand washing."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Approximately how many deaths are caused annually by diarrheal diseases worldwide, making them the 3rd leading infectious killer?",
        options: [
          { text: "1.5 million deaths", correct: true },
          { text: "15,000 deaths", correct: false },
          { text: "150 million deaths", correct: false },
          { text: "15 billion deaths", correct: false }
        ],
        explanation: "Diarrheal diseases kill approximately 1.5 million people annually."
      },
      {
        lec: 1,
        type: "mcq",
        text: "How do infectious diseases rank as a cause of death globally compared to in Canada?",
        options: [
          { text: "1st globally, 3rd in Canada", correct: true },
          { text: "3rd globally, 1st in Canada", correct: false },
          { text: "1st globally, 1st in Canada", correct: false },
          { text: "3rd globally, 3rd in Canada", correct: false }
        ],
        explanation: "Infectious diseases are the 1st cause of death worldwide but rank 3rd in Canada."
      },
      {
        lec: 1,
        type: "mcq",
        text: "What is the term for using bacteria or microbes to clean up environmental disasters such as oil spills?",
        options: [
          { text: "Bioremediation", correct: true },
          { text: "Pasteurization", correct: false },
          { text: "Fermentation", correct: false },
          { text: "Sterilization", correct: false }
        ],
        explanation: "Bioremediation involves treating the environment with bacteria to clean up contamination."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Thinking Application: A public health official is asked why Canada continues mandatory polio vaccination when active domestic wild-type cases are zero. What is the precise epidemiological rationale?",
        options: [
          { text: "International travel and globalization can easily reintroduce the virus from endemic regions.", correct: true },
          { text: "The vaccine provides essential cross-immunity against seasonal influenza strains.", correct: false },
          { text: "Canadian soil naturally harbors dormant wild-type polio spores.", correct: false },
          { text: "Vaccination prevents normal gut flora from mutating into poliovirus.", correct: false }
        ],
        explanation: "Global travel and globalization risk reintroducing polio from regions where it remains endemic."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Thinking Application: If a laboratory culture yields a microbe that is completely unaffected by penicillin and lacks any internal metabolic enzymes or ribosomes, how should it be classified?",
        options: [
          { text: "As an acellular infectious particle (virus or prion)", correct: true },
          { text: "As a single-celled eukaryotic protozoan", correct: false },
          { text: "As a multicellular helminthic worm", correct: false },
          { text: "As a multi-celled mold fungus", correct: false }
        ],
        explanation: "Lack of cells, ribosomes, and metabolic machinery combined with antibiotic resistance defines acellular entities like viruses and prions."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Thinking Application: In a hospital outbreak investigation, an immunocompetent patient develops a severe systemic infection from Staphylococcus epidermidis, a bacterium normally residing harmlessly on the skin. How is this pathogen classified?",
        options: [
          { text: "As an opportunist", correct: true },
          { text: "As an obligate acellular parasite", correct: false },
          { text: "As an obligate extracellular prion", correct: false },
          { text: "As a primary multi-cellular pathogen", correct: false }
        ],
        explanation: "S. epidermidis is a nonpathogen that acts as an opportunist when introduced into unusual locations or settings."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Thinking Application: Why did Robert Koch's postulates represent a major breakthrough over Louis Pasteur's earlier work regarding the germ theory?",
        options: [
          { text: "Koch scientifically proved the germ theory by isolating and growing specific microbes to reproduce disease.", correct: true },
          { text: "Pasteur only studied acellular prions, whereas Koch studied eukaryotic fungi.", correct: false },
          { text: "Koch invented the transmission electron microscope to visualize virus capsids.", correct: false },
          { text: "Pasteur rejected the idea that microbes could cause human illness.", correct: false }
        ],
        explanation: "While Pasteur proposed the germ theory, Koch proved it by isolating causative agents and satisfying his postulates."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Thinking Application: Measles possesses an almost 100% effective vaccine, yet global case numbers have risen significantly in recent years. What is the primary driving factor?",
        options: [
          { text: "Vaccine hesitancy and reduced immunization rates", correct: true },
          { text: "Natural mutation of measles into an acellular prion", correct: false },
          { text: "Widespread bacterial resistance to agar media", correct: false },
          { text: "Failure of pasteurization in milk supply chains", correct: false }
        ],
        explanation: "Vaccine hesitancy has led to declining uptake, fueling resurgences of highly infectious measles."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Thinking Application: An infectious disease epidemiologist notes that an outbreak involves an agent passing through human feces and being subsequently consumed. Which disease matches this transmission cycle?",
        options: [
          { text: "Wild-type Polio", correct: true },
          { text: "Measles", correct: false },
          { text: "Acute lower respiratory pneumonia", correct: false },
          { text: "Smallpox", correct: false }
        ],
        explanation: "Wild-type polio transmission occurs when the virus passes through feces and is then consumed."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Thinking Application: Who was Angelina Fanny Hesse and what pivotal contribution did she make to microbiology laboratories?",
        options: [
          { text: "An unpaid lab assistant who first suggested agar as a solid growth medium", correct: true },
          { text: "The epidemiologist who traced cholera to a London water pump", correct: false },
          { text: "The physician who mandated chlorine handwashing in obstetrics", correct: false },
          { text: "The researcher who discovered tobacco mosaic virus", correct: false }
        ],
        explanation: "Angelina Fanny Hesse suggested agar as a growth medium for bacterial cultures."
      },
      {
        lec: 1,
        type: "mcq",
        text: "Thinking Application: Which of the following best describes the global status of smallpox as an infectious disease?",
        options: [
          { text: "It is completely and officially eradicated worldwide.", correct: true },
          { text: "It remains the number one infectious killer globally.", correct: false },
          { text: "It is endemic across Southeast Asia and Africa.", correct: false },
          { text: "It is currently undergoing re-emergence due to vaccine hesitancy.", correct: false }
        ],
        explanation: "Smallpox is the only infectious human disease completely eradicated globally."
      },

      // ==========================================
      // LECTURE 2: General & Bacterial Character (20 Qs: 16 MCQ, 4 SATA)
      // ==========================================
      {
        lec: 2,
        type: "sata",
        text: "Which core cellular components are shared by BOTH prokaryotic and eukaryotic cells? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Cytoplasm", correct: true },
          { text: "Ribosomes", correct: true },
          { text: "Genetic material (DNA)", correct: true },
          { text: "Plasma (cell) membrane", correct: true },
          { text: "True membrane-bound nucleus", correct: false }
        ],
        explanation: "Both prokaryotes and eukaryotes share cytoplasm, ribosomes, DNA, and plasma membranes. Only eukaryotes possess a true nucleus."
      },
      {
        lec: 2,
        type: "sata",
        text: "Which structural and chemical features distinguish Gram-positive bacterial cell walls from Gram-negative walls? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Gram-positive walls possess a thick peptidoglycan layer.", correct: true },
          { text: "Gram-negative walls possess an outer protective membrane containing LPS endotoxins.", correct: true },
          { text: "Gram-positive bacteria are generally highly susceptible to penicillin.", correct: true },
          { text: "Gram-negative bacteria lose crystal violet during decolorization and stain pink/red.", correct: true },
          { text: "Gram-negative bacteria have a thick peptidoglycan layer without an outer membrane.", correct: false }
        ],
        explanation: "Gram-positive bacteria have thick peptidoglycan and are sensitive to penicillin. Gram-negative bacteria have a thin peptidoglycan layer, an outer membrane with LPS, and stain pink/red."
      },
      {
        lec: 2,
        type: "sata",
        text: "What are the primary functions of specialized bacterial surface structures and appendages? (SELECT ALL THAT APPLY)",
        options: [
          { text: "Glycocalyx (capsules/slime layers) protects against white blood cell phagocytosis.", correct: true },
          { text: "Fimbriae help bacteria adhere tightly to host tissues and surfaces.", correct: true },
          { text: "Sex pili form intercellular bridges for horizontal gene transfer (conjugation).", correct: true },
          { text: "Endospores provide extreme survival resistance against heat and starvation.", correct: true },
          { text: "Flagella serve as primary reproductive structures during binary fission.", correct: false }
        ],
        explanation: "Glycocalyx protects against phagocytosis, fimbriae aid adhesion, sex pili enable conjugation, and endospores ensure survival. Flagella are for motility."
      },
      {
        lec: 2,
        type: "sata",
        text: "Which statements correctly describe bacterial growth dynamics and cultivation media? (SELECT ALL THAT APPLY)",
        options: [
          { text: "During the log (exponential) phase, bacteria undergo rapid doubling and clinical symptoms peak.", correct: true },
          { text: "Selective media inhibit unwanted microbes while encouraging specific targets.", correct: true },
          { text: "Differential media allow multiple species to grow while visually distinguishing them.", correct: true },
          { text: "Binary fission is the asexual reproduction process where one cell splits into two clones.", correct: true },
          { text: "Endospores are reproductive structures designed to multiply cell numbers rapidly.", correct: false }
        ],
        explanation: "Log phase features rapid doubling and peak symptoms; selective and differential media serve distinct identification purposes; binary fission is asexual division. Endospores are for survival, not reproduction."
      },
      {
        lec: 2,
        type: "mcq",
        text: "What are the correct formatting rules for writing binomial nomenclature species names?",
        options: [
          { text: "Genus capitalized, species lowercase, both italicized (or underlined)", correct: true },
          { text: "Both words lowercase and enclosed in quotation marks", correct: false },
          { text: "Species capitalized first, followed by lowercase genus name", correct: false },

    questionBank.push(...addedQuestions);

    // ---------------------------------------------------------
    // TEST LOGIC: shuffled lecture sets, filters, Submit, SATA partial credit
    // ---------------------------------------------------------
    let currentLec = "all";
    let shuffledQuestions = [];
    let activeQuestions = [];
    // keyed by stable question id (the original position in questionBank)
    const userState = new Map();

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildShuffledQuestionSet() {
        // Shuffle each lecture independently so every lecture is randomized,
        // then shuffle the complete set so All mixes lectures and question types.
        const grouped = [];
        const lectureNumbers = [...new Set(questionBank.map(q => q.lec))].sort((a, b) => a - b);
        for (const lec of lectureNumbers) {
            const lectureQuestions = questionBank
                .map((q, index) => ({ ...q, qid: index }))
                .filter(q => q.lec === lec);
            grouped.push(...shuffleArray(lectureQuestions).map(q => ({
                ...q,
                options: shuffleArray(q.options)
            })));
        }
        shuffledQuestions = shuffleArray(grouped);
    }

    function setActiveQuestions(lec) {
        currentLec = lec;
        activeQuestions = lec === "all"
            ? [...shuffledQuestions]
            : shuffledQuestions.filter(q => q.lec === Number(lec));
    }

    function resetAttempt() {
        userState.clear();
        buildShuffledQuestionSet();
        setActiveQuestions(currentLec);
        renderQuestions();
        updateScore();
    }

    function filterQuestions(lec, button) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        setActiveQuestions(lec);
        renderQuestions();
        updateScore();
    }

    function updateScore() {
        let submittedCount = 0;
        let totalScore = 0;

        userState.forEach(state => {
            if (state.submitted) {
                submittedCount++;
                totalScore += state.score;
            }
        });

        const grade = submittedCount > 0
            ? Math.round((totalScore / submittedCount) * 100)
            : 0;

        const scoreElem = document.getElementById('score-counter');
        scoreElem.textContent = `Grade: ${grade}%`;
        scoreElem.title = `Answered ${submittedCount} / ${questionBank.length}`;
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D', 'E'];

        activeQuestions.forEach((q, displayIndex) => {
            const state = userState.get(q.qid) || { submitted: false, selected: [], score: 0 };
            const card = document.createElement('div');
            card.className = 'q-card';
            card.id = `qcard-${q.qid}`;

            if (state.submitted) {
                card.classList.add('answered');
                if (state.score === 1) card.classList.add('is-correct');
                else if (state.score > 0) card.classList.add('is-partial');
                else card.classList.add('is-wrong');
            }

            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                let extraClass = '';
                if (state.submitted) {
                    if (opt.correct && state.score === 1) extraClass = 'user-correct';
                    else if (opt.correct) extraClass = 'reveal-correct';
                    else if (state.selected.includes(optIndex)) extraClass = 'user-wrong';
                } else if (state.selected.includes(optIndex)) {
                    extraClass = 'selected';
                }

                optionsHTML += `
                    <button type="button" class="opt-btn ${extraClass}"
                            ${state.submitted ? 'disabled' : ''}
                            onclick="handleOptionClick(${q.qid}, ${optIndex})">
                        <span class="opt-prefix">${letters[optIndex]}.</span>
                        <span>${escapeHTML(opt.text)}</span>
                    </button>
                `;
            });

            const badge = q.type === 'sata' ? 'SATA' : 'MCQ';
            const submitDisabled = state.submitted || state.selected.length === 0 ? 'disabled' : '';
            const buttonText = state.submitted ? 'Submitted' : 'Submit Answer';

            card.innerHTML = `
                <div class="q-header">
                    <span class="q-num">Question ${displayIndex + 1}</span>
                    <span class="q-cat">${badge}</span>
                </div>
                <div class="q-text">${escapeHTML(q.text)}</div>
                <div class="opt-list">${optionsHTML}</div>
                <button class="submit-q-btn" id="btn_${q.qid}" ${submitDisabled}
                        onclick="submitAnswer(${q.qid})">${buttonText}</button>
                <div class="feedback-box" id="feedback_${q.qid}"></div>
            `;

            container.appendChild(card);
            if (state.submitted) showFeedback(q.qid);
        });
    }

    function handleOptionClick(qid, optIndex) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        if (!q) return;

        const existing = userState.get(qid) || { submitted: false, selected: [], score: 0 };
        if (existing.submitted) return;

        let selected;
        if (q.type === 'mcq') {
            selected = [optIndex];
        } else {
            selected = [...existing.selected];
            const index = selected.indexOf(optIndex);
            if (index >= 0) selected.splice(index, 1);
            else selected.push(optIndex);
        }

        userState.set(qid, { submitted: false, selected, score: 0 });
        renderQuestions();
    }

    function submitAnswer(qid) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        const state = userState.get(qid);
        if (!q || !state || state.selected.length === 0 || state.submitted) return;

        state.submitted = true;

        if (q.type === 'mcq') {
            state.score = q.options[state.selected[0]]?.correct ? 1 : 0;
        } else {
            const totalCorrect = q.options.filter(option => option.correct).length;
            let correctSelected = 0;
            let incorrectSelected = 0;

            state.selected.forEach(index => {
                if (q.options[index]?.correct) correctSelected++;
                else incorrectSelected++;
            });

            // Partial-credit scoring requested for SATA questions:
            // +1/N for each correct selection, -1/N for each incorrect selection,
            // with a minimum of 0 and a maximum of 1.
            state.score = Math.min(1, Math.max(0, (correctSelected - incorrectSelected) / totalCorrect));
        }

        userState.set(qid, state);
        updateScore();
        renderQuestions();
    }

    function showFeedback(qid) {
        const q = shuffledQuestions.find(item => item.qid === qid);
        const state = userState.get(qid);
        const fbBox = document.getElementById(`feedback_${qid}`);
        if (!q || !state || !fbBox) return;

        let statusClass = 'incorrect';
        let titleText = '✗ Incorrect';

        if (state.score === 1) {
            statusClass = 'correct';
            titleText = '✓ Correct!';
        } else if (state.score > 0) {
            statusClass = 'partial';
            titleText = `Partial Credit (+${state.score.toFixed(2)})`;
        }

        fbBox.className = `feedback-box ${statusClass}`;
        fbBox.style.display = 'block';
        fbBox.innerHTML = `
            <div class="feedback-title">${titleText}</div>
            <div class="explanation">${escapeHTML(q.explanation)}</div>
        `;
    }

    function escapeHTML(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    document.getElementById('navTabs').addEventListener('click', event => {
        const button = event.target.closest('.filter-btn');
        if (!button) return;
        filterQuestions(button.dataset.lec, button);
    });

    document.getElementById('resetBtn').addEventListener('click', resetAttempt);

    // Default state: All questions visible, shuffled on page load.
    buildShuffledQuestionSet();
    setActiveQuestions('all');
    renderQuestions();
    updateScore();

    </script>
